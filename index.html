<style>
  :root{
    --bg:#F6F1E4;
    --surface:#FFFFFF;
    --ink:#1B2A41;
    --ink-soft:#5B6B82;
    --accent:#C6862B;
    --accent-dark:#9C6B1E;
    --danger:#B5452B;
    --warn:#C97A2B;
    --success:#3F7856;
    --border:#DDD6C7;
    --frais:#3F7856;
    --supp-blue:#2E6DA4;
    --sec:#8A6D3B;
    --fl:#4A7A9E;
    --caisse:#7A4A9E;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;}
  .app{max-width:1100px;margin:0 auto;padding:20px 16px 60px;background-image:radial-gradient(circle, rgba(27,42,65,0.05) 1px, transparent 1px);background-size:16px 16px;}
  h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0;color:var(--ink);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  /* ---- Login ---- */
  .login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:40px 28px 32px;width:100%;max-width:380px;box-shadow:0 12px 32px rgba(27,42,65,0.10),0 2px 0 var(--border);}
  .login-card::before{content:'';position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:26px;height:26px;background:var(--bg);border:3px solid var(--ink);border-radius:50%;box-shadow:0 3px 0 rgba(27,42,65,0.08);}
  .login-card::after{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:10px 10px 0 0;background:repeating-linear-gradient(to right, var(--accent) 0 10px, transparent 10px 18px);}
  .login-eyebrow{font-family:'Oswald';font-size:12px;letter-spacing:.22em;color:var(--accent-dark);margin-bottom:6px;text-align:center;}
  .login-title{font-family:'Oswald';font-size:29px;font-weight:700;letter-spacing:.01em;margin-bottom:24px;text-align:center;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-family:'Oswald';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
  .field select, .field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;background:#FCFBF8;font-size:15px;color:var(--ink);}
  .field input:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .field input.pin{letter-spacing:.4em;font-family:'IBM Plex Mono';text-align:center;font-size:20px;}
  .btn{border:none;border-radius:4px;padding:11px 18px;font-weight:600;font-size:14px;transition:transform .08s ease;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--ink);color:#fff;width:100%;}
  .btn-primary:hover{background:#0f1c30;}
  .btn-accent{background:var(--accent);color:var(--ink);}
  .btn-accent:hover{background:var(--accent-dark);color:#fff;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-success{background:transparent;border:1px solid var(--success);color:var(--success);}
  .btn-success:hover{background:var(--success);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:3px;}
  .error-msg{color:var(--danger);font-size:13px;margin-top:10px;font-weight:600;}

  /* ---- Shell ---- */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:2px solid var(--ink);margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;flex-direction:column;}
  .brand .eyebrow{font-family:'Oswald';font-size:11px;letter-spacing:.18em;color:var(--accent-dark);}
  .brand h1{font-size:23px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;}
  .brand h1::before{content:'';display:inline-block;width:11px;height:11px;border:2px solid var(--accent);border-radius:2px;transform:rotate(45deg);flex-shrink:0;}
  .session-info{display:flex;align-items:center;gap:12px;}
  .session-tag{font-family:'Oswald';font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:#fff;padding:5px 10px;border-radius:3px;}
  .session-tag.direction{background:var(--accent-dark);}
  .session-tag.rh{background:#5B4488;}

  .tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;border-bottom:2px solid var(--ink);}
  .tab{padding:9px 16px;border-radius:5px 5px 0 0;font-family:'Oswald';font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:transparent;border:none;color:var(--ink-soft);position:relative;top:2px;}
  .tab.active{color:var(--ink);font-weight:700;background:var(--accent);border-radius:5px 5px 0 0;}
  .tab.tab-alert{color:var(--danger);font-weight:700;}
  .tab:hover{color:var(--ink);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:16px;box-shadow:0 1px 0 rgba(27,42,65,0.04);}
  .card h2{font-size:16px;margin-bottom:14px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  /* stat tiles */
  .stat-tile{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:18px 16px 16px 22px;border-left:4px solid var(--accent);overflow:hidden;}
  .stat-tile::before{content:'';position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;background:var(--bg);border:2px solid var(--border);border-radius:50%;}
  .stat-tile .val{font-family:'IBM Plex Mono';font-size:30px;font-weight:700;letter-spacing:-.01em;}
  .stat-tile .lbl{font-family:'Oswald';font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:2px;}

  /* fiche/ticket entry card */
  .fiche{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:4px;margin-bottom:10px;overflow:hidden;}
  .fiche .tag{width:6px;flex-shrink:0;}
  .fiche .body{padding:12px 14px;flex:1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .fiche .type-lbl{font-family:'Oswald';font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:2px;color:#fff;display:inline-block;margin-bottom:4px;}
  .fiche .name{font-weight:600;font-size:15px;}
  .fiche .meta{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
  .fiche .edited-note{color:var(--accent-dark);font-size:12px;margin-top:3px;font-weight:600;}
  .fiche .actions{display:flex;gap:6px;align-items:center;}
  .badge{font-family:'Oswald';font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:12px;}
  .badge.recup, .badge.valide{background:#E3EFE8;color:var(--success);}
  .badge.payer{background:#F4E6DA;color:var(--warn);}
  .badge.attente{background:#EFE9DC;color:var(--ink-soft);}
  .badge.refuse{background:#F5DEDA;color:var(--danger);}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty .big{font-size:32px;margin-bottom:8px;}

  .row-inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .chip-select{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:7px 13px;border:1px solid var(--border);border-radius:20px;font-size:13px;background:#fff;color:var(--ink-soft);}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{font-family:'Oswald';font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);}
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:#FBFAF6;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 22px;border-radius:5px;font-size:13px;font-weight:600;z-index:50;opacity:0;transition:opacity .25s ease;pointer-events:none;}
  .toast.show{opacity:1;}

  .divider{height:1px;background-image:linear-gradient(to right, var(--border) 55%, transparent 45%);background-size:9px 1px;margin:16px 0;}
  .helptext{color:var(--ink-soft);font-size:12.5px;margin-top:4px;}
  .list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}

  select.small, input.small, textarea.small{padding:7px 9px;font-size:13px;}

  /* progress bar for leave balance */
  .balance-bar-wrap{width:120px;height:8px;background:#EFE9DC;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;}
  .balance-bar{height:100%;background:var(--success);}
  .balance-bar.over{background:var(--danger);}
  .ot-table{font-size:12.5px;}
  .ot-table th, .ot-table td{padding:6px 8px;text-align:center;white-space:nowrap;}
  .ot-table td:first-child, .ot-table th:first-child{text-align:left;}
  .ot-month{color:var(--ink-soft);}
  .ot-month.has-hours{color:var(--ink);font-weight:600;}
  .ot-total{font-weight:700;}
  .ot-total.ok{color:var(--success);}
  .ot-total.warn{color:var(--warn);}
  .ot-total.over{color:var(--danger);}
  .ot-alert-banner{background:#FDEDE7;border:1px solid var(--danger);border-radius:6px;padding:14px 16px;margin-bottom:16px;}
  .ot-alert-banner h2{color:var(--danger);font-size:14px;}
  .ot-alert-item{font-size:13px;padding:4px 0;}
  .allocation-input{width:56px;padding:4px 6px;font-size:12.5px;text-align:center;border:1px solid var(--border);border-radius:3px;}

  .journal-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
  .journal-row .jdot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0;}
  .journal-row .jbody{flex:1;}
  .journal-row .jaction{font-family:'Oswald';font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-dark);}
  .journal-row .jdetail{font-size:13.5px;margin-top:2px;}
  .journal-row .jmeta{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  /* planning hebdomadaire — grille façon Excel */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .xl-wrap{border:1px solid #C7C0AC;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(27,42,65,0.07);}
  .xl-sheet{border-collapse:collapse;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:13px;background:#fff;}
  .xl-sheet td, .xl-sheet th{border:1px solid #DCD6C4;padding:8px 8px;text-align:center;white-space:nowrap;}
  .xl-th{background:#EAE4D3;font-family:Arial,Helvetica,sans-serif;font-size:11.5px;font-weight:700;color:var(--ink);padding:9px 6px;border-color:#C7C0AC;letter-spacing:normal;}
  .xl-day{background:#F5F1E8;font-weight:700;text-transform:uppercase;text-align:left;font-size:12.5px;font-family:Arial,Helvetica,sans-serif;width:100px;}
  .xl-total{font-weight:700;background:#FBF8F1;font-size:13.5px;}
  .xl-label{background:#EAE4D3;font-weight:700;text-align:left;font-size:13px;font-family:Arial,Helvetica,sans-serif;padding:9px 12px;border-color:#C7C0AC;width:1%;}
  .xl-value{text-align:left;font-family:Arial,Helvetica,sans-serif;padding:9px 12px;font-weight:700;}
  .xl-input{border:none;background:transparent;font-family:Arial,Helvetica,sans-serif;font-size:13px;width:100%;padding:3px 2px;}
  .xl-input:focus{outline:1px solid var(--accent);background:#FFFDF8;}
  select.time-select{border:none;background:transparent;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;padding:5px 0;width:58px;text-align:center;}
  select.time-select:focus{outline:1px solid var(--accent);background:#FFFDF8;}
  input.xl-comment{border:none;background:transparent;font-family:Arial,Helvetica,sans-serif;font-size:12px;width:100%;padding:5px 4px;}
  input.xl-comment:focus{outline:1px solid var(--accent);background:#FFFDF8;}
  .xl-sheet tr{height:38px;}
  .xl-sheet tbody tr:nth-child(even) td:not(.xl-total){background:#FCFAF4;}
  .week-nav{display:flex;align-items:center;gap:10px;}
  .week-nav .week-label{font-family:'Oswald';font-size:13px;letter-spacing:.03em;min-width:120px;text-align:center;}

  /* calendrier des congés */
  .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .cal-month-label{font-family:'Oswald';font-size:16px;letter-spacing:.03em;text-transform:capitalize;min-width:170px;text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-weekday{font-family:'Oswald';font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding-bottom:4px;}
  .cal-day{border:1px solid var(--border);border-radius:5px;min-height:74px;padding:4px;background:#fff;display:flex;flex-direction:column;gap:2px;}
  .cal-day.other-month{opacity:.3;background:#FAF8F3;}
  .cal-day.is-today{border-color:var(--accent);border-width:2px;}
  .cal-daynum{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);}
  .cal-holiday-lbl{font-size:8.5px;color:var(--accent-dark);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .cal-chip{font-size:9px;padding:1px 4px;border-radius:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;}
  .cal-chip.attente{opacity:.5;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.25),rgba(255,255,255,.25) 3px,transparent 3px,transparent 6px);}
  .cal-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .cal-legend-item{display:flex;align-items:center;gap:5px;font-size:12px;}
  .cal-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  @media(max-width:640px){.cal-day{min-height:56px;}.cal-chip{font-size:7.5px;}}
  .scan-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;border:1px dashed var(--border);border-radius:6px;background:#FBFAF6;}
  .scan-icon{width:34px;height:34px;border-radius:6px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-size:11px;flex-shrink:0;}
  .drop-zone{border:2px dashed var(--border);border-radius:8px;padding:24px;text-align:center;background:#FBFAF6;transition:border-color .15s ease,background .15s ease;}
  .drop-zone.drag-over{border-color:var(--accent);background:#FBF4E4;}
  .scan-modal-overlay{position:fixed;inset:0;background:rgba(27,42,65,0.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  .scan-modal-box{background:#fff;border-radius:8px;width:100%;max-width:960px;height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.3);}
  .scan-modal-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .scan-modal-body{flex:1;overflow:auto;background:#525659;display:flex;}
  .scan-modal-body iframe{width:100%;height:100%;border:none;}
  .scan-modal-body img{max-width:100%;max-height:100%;margin:auto;display:block;}

  @media print{
    body *{visibility:hidden;}
    #printable-planning, #printable-planning *{visibility:visible;}
    #printable-planning{position:absolute;left:0;top:0;width:100%;overflow:visible;}
    .xl-wrap{box-shadow:none;}
    .xl-sheet{min-width:0;width:100%;font-size:12px;table-layout:fixed;}
    .no-print{display:none;}
    select.time-select{appearance:none;-webkit-appearance:none;background-image:none;}
    @page{size:landscape;margin:10mm;}
  }
</style>

<script>
/* ---------------- FIREBASE — remplace window.storage (Claude) pour un hébergement indépendant ---------------- */
const firebaseConfig = {

const _fbScriptPromises = {};
function _loadScriptEarly(src){
  if(_fbScriptPromises[src]) return _fbScriptPromises[src];
  _fbScriptPromises[src] = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('load failed: '+src));
    document.head.appendChild(s);
  });
  return _fbScriptPromises[src];
}

let fbRoot = null;
let _fbReadyPromise = null;
async function ensureFirebase(){
  if(fbRoot) return fbRoot;
  if(!_fbReadyPromise){
    _fbReadyPromise = (async ()=>{
      await _loadScriptEarly('https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-app.js');
      await _loadScriptEarly('https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-database.js');
      await _loadScriptEarly('https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-auth.js');
      firebase.initializeApp(firebaseConfig);
      await firebase.auth().signInAnonymously();
      fbRoot = firebase.database().ref('app_data');
      console.log('✅ Firebase initialisé et authentifié.');
    })();
  }
  await _fbReadyPromise;
  return fbRoot;
}

function fbSafeKey(key){
  // Les clés Firebase Realtime Database ne peuvent pas contenir . # $ [ ]
  return String(key).replace(/[.#$\[\]]/g, '_');
}

window.storage = {
  async get(key, shared){
    const root = await ensureFirebase();
    const snap = await root.child(fbSafeKey(key)).once('value');
    const val = snap.val();
    if(val === null || val === undefined) return null;
    return { key, value: val, shared: !!shared };
  },
  async set(key, value, shared){
    const root = await ensureFirebase();
    await root.child(fbSafeKey(key)).set(value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    const root = await ensureFirebase();
    await root.child(fbSafeKey(key)).remove();
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared){
    const root = await ensureFirebase();
    const snap = await root.once('value');
    const all = snap.val() || {};
    const safePrefix = prefix ? fbSafeKey(prefix) : '';
    const keys = Object.keys(all).filter(k => !safePrefix || k.startsWith(safePrefix));
    return { keys, prefix, shared: !!shared };
  }
};

const STORAGE_KEY = 'rh_data_v2';
const SECTEURS = ['Frais','Sec','Fruits & Légumes','Caisse'];
const SECTEUR_COLOR = {'Frais':'var(--frais)','Sec':'var(--sec)','Fruits & Légumes':'var(--fl)','Caisse':'var(--caisse)'};

const CONGE_TYPES = ['Congés payés','RTT','Sans solde','Maladie','Autre'];
const CONGE_STATUT_LABELS = {attente:'En attente', valide:'Validé', refuse:'Refusé'};
const DEFAULT_ALLOCATION = 30;

const SEED_EMPLOYEES = {
  'Caisse': [

function applySeedEmployees(){
  let added = 0;
  Object.keys(SEED_EMPLOYEES).forEach(secteur=>{
    SEED_EMPLOYEES[secteur].forEach(name=>{
      const exists = db.employees.some(e=> e.secteur===secteur && e.name.trim().toLowerCase()===name.trim().toLowerCase());
      if(!exists){
        db.employees.push({id: uid(), name, secteur, leaveAllocation: DEFAULT_ALLOCATION, isManager: /RESP/i.test(name), baseHours: 35});
        added++;
      }
    });
  });
  return added;
}

function applySeedWeeklySheets(list){
  let added = 0;
  list.forEach(entry=>{
    const emp = db.employees.find(e=> e.secteur===entry.secteur && e.name.trim().toLowerCase()===entry.employeeName.trim().toLowerCase());
    if(!emp) return;
    const already = db.weeklySheets.some(s=>s.employeeId===emp.id && s.weekStart===entry.weekStart);
    if(already) return;
    const weekEnd = ymd(addDays(new Date(entry.weekStart+'T00:00:00'),6));
    db.weeklySheets.push({
      id: uid(), employeeId: emp.id, employeeName: emp.name, secteur: emp.secteur,
      weekStart: entry.weekStart, weekEnd, days: entry.days,
      createdBy:'Système', createdAt: new Date().toISOString(),
      updatedBy:'Système', updatedAt: new Date().toISOString()
    });
    added++;
  });
  return added;
}

  { name:'LABAIED Khaoula', secteur:'Caisse' },
  { name:'LABY Maelisse', secteur:'Caisse' }
];
function applySeedEmployeesExtra(){
  let added = 0;
  SEED_EMPLOYEES_EXTRA.forEach(e=>{
    const exists = db.employees.some(x=> x.secteur===e.secteur && x.name.trim().toLowerCase()===e.name.trim().toLowerCase());
    if(!exists){
      db.employees.push({id: uid(), name:e.name, secteur:e.secteur, leaveAllocation: DEFAULT_ALLOCATION, isManager:false, baseHours:35});
      added++;
    }
  });
  return added;
}

/* Backup automatique quotidien — une copie complète de la base est sauvegardée dans Firebase
   (sous une clé datée) la première fois que l'app est utilisée chaque jour. Pas besoin d'être
   présent à une heure précise : ça se déclenche tout seul dès qu'un écran s'ouvre ce jour-là. */
async function runAutoBackupIfNeeded(){
  try{
    const today = new Date().toISOString().slice(0,10);
    if(db.lastAutoBackupDate === today) return;
    await window.storage.set('autobackup_'+today, JSON.stringify(db), true);
    db.lastAutoBackupDate = today;
    await saveDB();
    console.log('✅ Backup automatique du '+today+' créé.');
  }catch(e){
    console.warn('⚠️ Backup automatique : échec silencieux.', e);
  }
}

async function loadDB(){
  try{
    const res = await withTimeout(window.storage.get(STORAGE_KEY, true), 12000, 'connexion à Firebase');
    if(res && res.value){ db = JSON.parse(res.value); console.log('✅ Données chargées depuis Firebase.'); }
    else {
      console.warn('⚠️ Aucune donnée trouvée sur Firebase (base vide) — initialisation avec les valeurs par défaut.');
      // Migration : récupère les données de l'ancienne version si elles existent
      let migrated = null;
      try{
        const old = await withTimeout(window.storage.get('rh_data_v1', true), 8000, 'migration');
        if(old && old.value) migrated = JSON.parse(old.value);
      }catch(eOld){ /* pas d'ancienne donnée, on continue */ }
      db = migrated ? Object.assign(defaultDB(), migrated) : defaultDB();
      await saveDB();
    }
  }catch(e){
    console.error('❌ ERREUR FIREBASE lors du chargement :', e);
    db = defaultDB();
    try{ await saveDB(); }catch(e2){ console.error('❌ ERREUR FIREBASE lors de la sauvegarde initiale :', e2); }

/* Pavé de signature tactile — fonctionne au doigt ou au stylet sur tablette, comme au souris sur PC */
function setupSignaturePad(canvas){
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#1B2A41';
  ctx.lineWidth = 2.6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let drawing = false, lastX = 0, lastY = 0, hasDrawn = false;
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx-rect.left) * (canvas.width/rect.width), y: (cy-rect.top) * (canvas.height/rect.height) };
  }
  function start(e){ e.preventDefault(); drawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
    lastX = p.x; lastY = p.y; hasDrawn = true;
  }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  return { clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn = false; }, hasSignature(){ return hasDrawn; } };
}

/* ---- Jours fériés français (fixes + mobiles calculés depuis Pâques) ---- */
function easterSunday(year){
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
  const i = Math.floor(c/4), k = c % 4, l = (32+2*e+2*i-h-k) % 7;
  const m = Math.floor((a+11*h+22*l)/451);
  const monthDay = h+l-7*m+114;
  const month = Math.floor(monthDay/31);
  const day = (monthDay % 31) + 1;
  return new Date(year, month-1, day);
}
function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+n); return d; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

const _holidaysCache = {};
function frenchHolidays(year){
  if(_holidaysCache[year]) return _holidaysCache[year];
  const easter = easterSunday(year);
  const list = [
    {date: ymd(new Date(year,0,1)), label:"Jour de l'An"},
    {date: ymd(addDays(easter,1)), label:"Lundi de Pâques"},
    {date: ymd(new Date(year,4,1)), label:"Fête du Travail"},
    {date: ymd(new Date(year,4,8)), label:"Victoire 1945"},
    {date: ymd(addDays(easter,39)), label:"Ascension"},
    {date: ymd(addDays(easter,50)), label:"Lundi de Pentecôte"},
    {date: ymd(new Date(year,6,14)), label:"Fête Nationale"},
    {date: ymd(new Date(year,7,15)), label:"Assomption"},
    {date: ymd(new Date(year,10,1)), label:"Toussaint"},
    {date: ymd(new Date(year,10,11)), label:"Armistice"},
    {date: ymd(new Date(year,11,25)), label:"Noël"}
  ];
  list.sort((a,b)=>a.date.localeCompare(b.date));
  _holidaysCache[year] = list;
  return list;
}
function isHoliday(dateStr){
  const year = parseInt(dateStr.slice(0,4),10);
  return frenchHolidays(year).some(h=>h.date===dateStr);
}

/* ---- Helpers planning hebdomadaire ---- */
const DAYS_FR = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
function mondayOf(date){
  const d = new Date(date);
  const day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  d.setHours(0,0,0,0);
  return d;
}
function isoWeekNumber(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}
function hoursBetween(startStr, endStr){
  if(!startStr || !endStr) return 0;
  const [sh,sm] = startStr.split(':').map(Number);
  const [eh,em] = endStr.split(':').map(Number);
  if(isNaN(sh)||isNaN(eh)) return 0;
  const diff = (eh+em/60) - (sh+sm/60);
  return diff>0 ? diff : 0;
}
function blankDay(){ return {m1s:'',m1e:'',m2s:'',m2e:'',a1s:'',a1e:'',a2s:'',a2e:'',comment:''}; }
function segmentTotal(start, pauseStart, pauseEnd, end){
  if(!start || !end) return 0;
  const full = hoursBetween(start, end);
  if(pauseStart && pauseEnd){
    const pause = hoursBetween(pauseStart, pauseEnd);
    return Math.max(0, full - pause);
  }
  return full;
}
function dayTotal(d){ return segmentTotal(d.m1s, d.m1e, d.m2s, d.m2e) + segmentTotal(d.a1s, d.a1e, d.a2s, d.a2e); }
function fmtHours(h){
  const totalMin = Math.round((h||0)*60);
  const hh = Math.floor(totalMin/60), mm = totalMin%60;
  return hh+'h'+String(mm).padStart(2,'0');
}
function stepTime(value, deltaMinutes){
  if(!value){ return deltaMinutes >= 0 ? '08:00' : '20:00'; }
  const [h,m] = value.split(':').map(Number);
  let total = h*60+m+deltaMinutes;
  total = ((total % 1440)+1440)%1440;
  const nh = Math.floor(total/60), nm = total%60;
  return String(nh).padStart(2,'0')+':'+String(nm).padStart(2,'0');
}

/* Jours de CP = jours ouvrables (lundi à samedi), dimanches et jours fériés exclus automatiquement */
function businessDays(startStr, endStr){
  const start = new Date(startStr+'T00:00:00');
  const end = new Date(endStr+'T00:00:00');
  if(isNaN(start)||isNaN(end)||end<start) return 0;
  let count=0;
  let d = new Date(start);
  while(d<=end){
    const day = d.getDay();
    if(day!==0 && !isHoliday(ymd(d))) count++;
    d.setDate(d.getDate()+1);
  }
  return count;
}

/* Répercute automatiquement retard / départ anticipé / absence / heures supp sur les horaires du bon jour de la feuille hebdomadaire */
function addMinutesToTimeStr(time, delta){
  if(!time) return time;
  const [h,m] = time.split(':').map(Number);
  let total = h*60+m+delta;
  total = ((total%1440)+1440)%1440;
  return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}

/* Comme addMinutesToTimeStr, mais ne franchit jamais minuit — l'heure de fin ne peut qu'avancer, jamais repartir en arrière (ce qui annulerait le total au lieu de l'augmenter). */
function addMinutesCapped(time, delta){
  if(!time) return time;
  const [h,m] = time.split(':').map(Number);
  let total = h*60+m+delta;
  if(total > 23*60+45) total = 23*60+45;
  if(total < 0) total = 0;
  return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}

/* Comme addMinutesCapped mais vers l'arrière — ne descend jamais sous 00:00, pour placer des heures supp avant le début de service sans jamais fausser le total. */
function addMinutesCappedBackward(time, delta){
  if(!time) return time;
  const [h,m] = time.split(':').map(Number);
  let total = h*60+m-delta;
  if(total < 0) total = 0;
  if(total > 23*60+45) total = 23*60+45;
  return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}

function applyEntryToDay(day, entryType, amount, direction){
  if(entryType==='absence'){
    ['m1s','m1e','m2s','m2e','a1s','a1e','a2s','a2e'].forEach(f=>{ day[f] = ''; });
    return true;
  }
  if(entryType==='retard'){
    if(day.m1s){ day.m1s = addMinutesToTimeStr(day.m1s, amount); return true; }
    if(day.a1s){ day.a1s = addMinutesToTimeStr(day.a1s, amount); return true; }
    return false;
  }
  if(entryType==='depart_anticipe'){
    if(day.a2e){ day.a2e = addMinutesToTimeStr(day.a2e, -amount); return true; }
    if(day.m2e){ day.m2e = addMinutesToTimeStr(day.m2e, -amount); return true; }
    return false;
  }
  if(entryType==='heures_supp'){
    const mins = Math.round(amount*60);
    if(direction==='before'){
      if(day.m1s){ day.m1s = addMinutesCappedBackward(day.m1s, mins); return true; }
      if(day.a1s){ day.a1s = addMinutesCappedBackward(day.a1s, mins); return true; }
      return false;
    }
    if(day.a2e){ day.a2e = addMinutesCapped(day.a2e, mins); return true; }
    if(day.m2e){ day.m2e = addMinutesCapped(day.m2e, mins); return true; }
    if(day.a1e){ day.a1e = addMinutesCapped(day.a1e, mins); return true; }
    if(day.m1e){ day.m1e = addMinutesCapped(day.m1e, mins); return true; }
    return false;
  }
  return false;
}

    const cleanup = (result)=>{ overlay.remove(); resolve(result); };
    overlay.querySelectorAll('[data-choice]').forEach(btn=>{
      btn.addEventListener('click', ()=>cleanup(btn.dataset.choice));
    });
    overlay.querySelector('#ohc-cancel').addEventListener('click', ()=>cleanup(null));
    overlay.addEventListener('click', e=>{ if(e.target===overlay) cleanup(null); });
  });
}

/* Fenêtre de blocage : dépassement des limites légales (10h/jour, 44h/semaine) */
function showBlockingModal(message){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'scan-modal-overlay';
    overlay.style.zIndex = '400';
    overlay.innerHTML = `
      <div class="scan-modal-box" style="max-width:440px;height:auto;">
        <div class="scan-modal-header"><strong style="color:var(--danger);">⛔ Impossible d'ajouter ces heures</strong></div>
        <div style="padding:20px;background:#fff;">
          <p style="margin:0 0 16px 0;">${esc(message)}</p>
          <button type="button" class="btn btn-ghost" id="ob-close" style="width:100%;">Fermer</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const cleanup = ()=>{ overlay.remove(); resolve(); };
    overlay.querySelector('#ob-close').addEventListener('click', cleanup);
    overlay.addEventListener('click', e=>{ if(e.target===overlay) cleanup(); });
  });
}

/* Regarde le jour et la semaine tels qu'ils sont AVANT modification, calcule les deux options possibles (avant/après),
   bloque si l'une ou l'autre dépasse 10h/jour ou 44h/semaine, sinon fait choisir à l'utilisateur. Ne modifie rien tant que ce n'est pas confirmé. */
const MARKET_OPEN_MIN = 6*60+30;  // 06:30
const MARKET_CLOSE_MIN = 21*60+15; // 21:15

async function resolveOvertimePlacement(employeeName, dayName, hoursToAdd, day, weekOtherDaysTotal){
  const attempts = {};
  ['after','before'].forEach(dir=>{
    const clone = JSON.parse(JSON.stringify(day));
    const ok = applyEntryToDay(clone, 'heures_supp', hoursToAdd, dir);
    const newTotal = dayTotal(clone);

    let marketOk = true;
    if(ok){
      if(dir==='after'){
        const field = day.a2e?'a2e':day.m2e?'m2e':day.a1e?'a1e':day.m1e?'m1e':null;
        if(field){
          const [h,m] = clone[field].split(':').map(Number);
          if((h*60+m) > MARKET_CLOSE_MIN) marketOk = false;
        }
      } else {
        const field = day.m1s?'m1s':day.a1s?'a1s':null;
        if(field){
          const [h,m] = clone[field].split(':').map(Number);
          if((h*60+m) < MARKET_OPEN_MIN) marketOk = false;
        }
      }
    }

    attempts[dir] = {
      ok, clone, newTotal, marketOk,
      dayOk: ok && newTotal <= 10.0001,
      weekOk: (weekOtherDaysTotal + newTotal) <= 44.0001
    };
    attempts[dir].valid = attempts[dir].dayOk && attempts[dir].weekOk && attempts[dir].marketOk;
  });

  if(!attempts.after.valid && !attempts.before.valid){
    let reason;
    if(!attempts.after.ok && !attempts.before.ok){
      reason = `Aucun horaire de référence trouvé ce jour-là (${esc(dayName)}) pour placer les heures supp automatiquement. Remplis d'abord un horaire de base pour ce jour dans le Planning, ou ajoute les heures directement là-bas.`;
    } else if(!attempts.after.marketOk && !attempts.before.marketOk){
      reason = `Ajouter ${hoursToAdd}h le ${esc(dayName)} sortirait des horaires d'ouverture du magasin (06:30 – 21:15) pour ${esc(employeeName)}. Aucune heure supp ne peut être placée en dehors de cette plage.`;
    } else if(!attempts.after.dayOk && !attempts.before.dayOk){
      reason = `Ajouter ${hoursToAdd}h le ${esc(dayName)} dépasserait la limite légale de 10h de travail par jour pour ${esc(employeeName)}.`;
    } else {
      reason = `Ajouter ${hoursToAdd}h ferait dépasser la limite légale de 44h de travail par semaine pour ${esc(employeeName)}.`;
    }
    await showBlockingModal(reason);
    return null;
  }

  const options = [];
  if(attempts.after.valid){
    const field = day.a2e?'a2e':day.m2e?'m2e':day.a1e?'a1e':day.m1e?'m1e':null;
    options.push({key:'after', label:'Après la fin de service', timeRangeLabel: field ? `${day[field]} → ${attempts.after.clone[field]}` : '', newTotal: attempts.after.newTotal});
  }
  if(attempts.before.valid){
    const field = day.m1s?'m1s':day.a1s?'a1s':null;
    options.push({key:'before', label:'Avant le début de service', timeRangeLabel: field ? `${attempts.before.clone[field]} → ${day[field]}` : '', newTotal: attempts.before.newTotal});
  }

  return await showOvertimeChoiceModal({employeeName, dayName, hoursToAdd, options});
}

/* Calcule, sans rien enregistrer, le jour visé et le reste de la semaine pour une future entrée */
function previewDayAndWeek(employeeId, date){
  const entryDate = new Date(date+'T00:00:00');
  const weekStart = ymd(mondayOf(entryDate));
  const dayIndex = (entryDate.getDay()+6)%7;
  const dayName = DAYS_FR[dayIndex];
  const sheet = db.weeklySheets.find(s=>s.employeeId===employeeId && s.weekStart===weekStart);
  let days;
  if(sheet){ days = sheet.days; }
  else {
    const template = getEmployeeBase(employeeId);
    days = {};
    DAYS_FR.forEach(d=>{ days[d] = template && template[d] ? JSON.parse(JSON.stringify(template[d])) : blankDay(); });
  }
  const day = Object.assign(blankDay(), days[dayName]||{});
  const weekOtherDaysTotal = DAYS_FR.filter(d=>d!==dayName).reduce((s,d)=> s + dayTotal(Object.assign(blankDay(), days[d]||{})), 0);
  return {weekStart, dayName, day, weekOtherDaysTotal};
}

function syncEntryToWeeklySheet(entry){
  const entryDate = new Date(entry.date+'T00:00:00');
  const weekStart = ymd(mondayOf(entryDate));
  const dayIndex = (entryDate.getDay()+6)%7; // Lundi=0...Dimanche=6
  const dayName = DAYS_FR[dayIndex];

  let noteText = '';
  if(entry.type==='retard') noteText = `Retard ${entry.minutes} min`;
  else if(entry.type==='depart_anticipe') noteText = `Départ anticipé ${entry.minutes} min`;
  else if(entry.type==='absence') noteText = 'Absence';
  else if(entry.type==='heures_supp') noteText = `Heures supp ${entry.hours}h`;
  if(entry.comment) noteText += ` — ${entry.comment}`;

  let sheet = db.weeklySheets.find(s=>s.employeeId===entry.employeeId && s.weekStart===weekStart);
  if(!sheet){
    const template = getEmployeeBase(entry.employeeId);
    const days = {};
    DAYS_FR.forEach(d=>{
      days[d] = template && template[d] ? JSON.parse(JSON.stringify(template[d])) : blankDay();
    });
    sheet = {
      id: uid(), employeeId: entry.employeeId, employeeName: entry.employeeName, secteur: entry.secteur,
      weekStart, weekEnd: ymd(addDays(new Date(weekStart+'T00:00:00'),6)), days,
      createdBy: session.name, createdAt: new Date().toISOString(),
      updatedBy: session.name, updatedAt: new Date().toISOString()
    };
    db.weeklySheets.push(sheet);
  }
  if(!sheet.days[dayName]) sheet.days[dayName] = blankDay();

  const dayBeforeSnapshot = JSON.parse(JSON.stringify(sheet.days[dayName]));

  const amount = entry.type==='heures_supp' ? entry.hours : entry.minutes;
  const adjusted = applyEntryToDay(sheet.days[dayName], entry.type, amount, entry.overtimeDirection);

  if(adjusted){
    entry.scheduleSnapshot = { weekStart, dayName, before: dayBeforeSnapshot };
  }

  const existingComment = sheet.days[dayName].comment;
  sheet.days[dayName].comment = existingComment ? `${existingComment} / ${noteText}` : noteText;
  sheet.updatedBy = session.name;
  sheet.updatedAt = new Date().toISOString();

  const adjustDetail = adjusted
    ? (entry.type==='absence' ? 'horaires du jour vidés' : entry.type==='heures_supp' ? `${amount}h ajoutées à la fin de journée` : `horaires décalés de ${amount} min`)
    : 'aucun horaire existant à ajuster ce jour-là (seul le commentaire a été ajouté)';
  addAudit('Planning modifié', `${entry.employeeName} — ${dayName} ${fmtDate(entry.date)} : ${adjustDetail} (depuis Nouvelle entrée — ${noteText})`, {secteur: entry.secteur, employeeName: entry.employeeName});
  return ` Planning de la semaine mis à jour (${dayName}).`;
}

      });
      addAudit('Import en masse', `${names.length} employé(s) importé(s) dans ${secteur}`, {secteur});

      row.querySelector('.emp-name-display').style.display = 'none';
      row.querySelector('.emp-name-edit').style.display = 'inline-block';

    });
  });

    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.empId;
      const emp = db.employees.find(e=>e.id===id);
      const row = document.querySelector(`tr[data-emp-row="${id}"]`);
      if(!emp || !row) return;
      const newName = row.querySelector('.emp-name-edit').value.trim();
      if(!newName){ showToast('Le nom ne peut pas être vide.'); return; }
      const oldName = emp.name;
      if(newName !== oldName){
        emp.name = newName;
        addAudit('Employé renommé', `${oldName} renommé en ${newName} (${emp.secteur})`, {secteur: emp.secteur, employeeName: newName});
        await saveDB();
        showToast('Nom mis à jour.');
      }
      render();
    });
  });
  document.querySelectorAll('.emp-name-edit').forEach(inp=>{

  document.querySelectorAll('[data-toggle-manager]').forEach(btn=>{

      const emp = db.employees.find(e=>e.id===btn.dataset.toggleManager);
      if(!emp) return;
      emp.isManager = !emp.isManager;
      addAudit('Statut modifié', `${emp.name} ${emp.isManager ? 'marqué responsable' : 'retiré du statut responsable'}`, {secteur: emp.secteur, employeeName: emp.name});
      await saveDB();
      showToast(emp.isManager ? `${emp.name} est maintenant responsable.` : `${emp.name} n'est plus marqué responsable.`);
      render();
    });
  });
  document.querySelectorAll('[data-remove-emp]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.removeEmp;
      const emp = db.employees.find(e=>e.id===id);
      if(!(await customConfirm('Retirer cet employé ? Son historique d\u2019entrées sera conservé, et sa fiche sera sauvegardée pour Direction/RH.'))) return;
      let trashId = null;
      if(emp){
        trashId = addToTrash('employee', {secteur: emp.secteur, employeeName: emp.name, summary: `Fiche employé retirée`}, JSON.parse(JSON.stringify(emp)));
      }
      db.employees = db.employees.filter(e=>e.id!==id);
      if(emp) addAudit('Employé retiré', `${emp.name} retiré du secteur ${emp.secteur}`, {secteur: emp.secteur, employeeName: emp.name, trashId});
      await saveDB();
      showToast('Employé retiré (copie conservée pour Direction/RH).');
      render();
    });
  });
}

function ficheHTML(e, allowActions){
  const color = TYPE_COLOR[e.type];
  let detail = '';
  if(e.type==='heures_supp'){
    detail = `${e.hours}h — <span class="badge ${e.decision}">${DECISION_LABELS[e.decision]}</span>`;
  } else if(e.type==='retard'){
    detail = `${e.minutes} min de retard`;
  } else if(e.type==='depart_anticipe'){
    detail = `${e.minutes} min de départ anticipé`;
  } else {
    detail = 'Absence journée';
  }
  const log = e.log || [];
  const editedNote = log.length > 1 ? `<div class="edited-note">✎ Modifié en dernier le ${fmtDateTime(log[log.length-1].at)} par ${esc(log[log.length-1].by)}</div>` : '';
  const actions = allowActions && e.type==='heures_supp' ? `
    <div class="actions">

        <option value="recup" ${e.decision==='recup'?'selected':''}>Récupération</option>

  return `
  <div class="fiche">
    <div class="tag" style="background:${color};"></div>

      <div>
        <span class="type-lbl" style="background:${color};">${TYPE_LABELS[e.type]}</span><br>
        <span class="name">${esc(e.employeeName)}</span> <span class="meta">· ${e.secteur} · ${fmtDate(e.date)}</span>

  document.querySelectorAll('[data-delete-entry]').forEach(btn=>{

      if(!(await customConfirm('Supprimer cette entrée ? Le planning sera remis exactement comme avant, et une copie sera conservée pour Direction/RH.'))) return;
      let trashId = null;
      let revertMsg = '';
      if(entry){
        trashId = addToTrash('entry',
          {secteur: entry.secteur, employeeName: entry.employeeName, summary: `${TYPE_LABELS[entry.type]} — ${fmtDate(entry.date)}`},
          JSON.parse(JSON.stringify(entry)));

        if(entry.scheduleSnapshot){
          const snap = entry.scheduleSnapshot;
          const sheet = db.weeklySheets.find(s=>s.employeeId===entry.employeeId && s.weekStart===snap.weekStart);
          if(sheet && sheet.days[snap.dayName]){
            sheet.days[snap.dayName] = JSON.parse(JSON.stringify(snap.before));
            sheet.updatedBy = session.name;
            sheet.updatedAt = new Date().toISOString();
            revertMsg = ' Planning remis comme avant.';

            // Si cette semaine avait une heures supp auto-générée par dépassement de l'horaire de base, on la retire aussi si elle n'a plus lieu d'être
            if(sheet.autoOvertimeEntryId){
              const emp = db.employees.find(e=>e.id===entry.employeeId);
              const base = emp ? (emp.baseHours||35) : 35;
              const newTotal = Object.values(sheet.days).reduce((s,d)=>s+dayTotal(d),0);
              const newExcess = Math.round((newTotal-base)*100)/100;
              if(newExcess<=0){
                db.entries = db.entries.filter(e2=>e2.id!==sheet.autoOvertimeEntryId);
                sheet.autoOvertimeEntryId = null;
              } else {
                const linked = db.entries.find(e2=>e2.id===sheet.autoOvertimeEntryId);
                if(linked) linked.hours = newExcess;
              }
            }
          }
        }
        addAudit('Suppression', `Entrée ${TYPE_LABELS[entry.type]} de ${entry.employeeName} supprimée${revertMsg}`, {secteur: entry.secteur, employeeName: entry.employeeName, entryId: entry.id, trashId});
      }
      db.entries = db.entries.filter(x=>x.id!==btn.dataset.deleteEntry);
      await saveDB();
      showToast('Entrée supprimée (copie conservée pour Direction/RH).' + revertMsg);
      render();
    });
  });

  const exportBtn = document.getElementById('export-csv-btn');
  if(exportBtn){
    exportBtn.addEventListener('click', ()=>{
      let entries = [...db.entries];
      if(!full) entries = entries.filter(e=>e.secteur===fixedSecteur);
      exportCSV(entries);
    });
  }
}

function exportCSV(entries){
  const header = ['Date','Secteur','Employe','Type','Heures','Minutes_retard','Decision','Commentaire','Saisi_par'];
  const rows = entries.map(e=>[
    e.date, e.secteur, e.employeeName, TYPE_LABELS[e.type],
    e.hours||'', e.minutes||'', e.decision?DECISION_LABELS[e.decision]:'',
    (e.comment||'').replace(/[\n,]/g,' '), e.createdBy
  ]);
  const csv = [header.join(';'), ...rows.map(r=>r.join(';'))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `historique_rh_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

let planningState = { employeeId: null, weekStart: null };
let planningPrecision = '15min'; // 'hour' | '15min' | 'minute'
function precisionStep(){ return planningPrecision==='minute' ? 1 : 15; }

function ensurePlanningDefaults(emps){
  if(!planningState.weekStart) planningState.weekStart = ymd(mondayOf(new Date()));
  if(!planningState.employeeId || !emps.some(e=>e.id===planningState.employeeId)){
    planningState.employeeId = emps.length ? emps[0].id : null;
  }
}
function findSheet(employeeId, weekStart){
  return db.weeklySheets.find(s=>s.employeeId===employeeId && s.weekStart===weekStart);
}
function getEmployeeBase(employeeId){
  return db.employeeBaseSchedules[employeeId] || null;
}
function setEmployeeBase(employeeId, days){
  const clean = {};
  DAYS_FR.forEach(d=>{
    const src = days[d] || blankDay();
    clean[d] = Object.assign(blankDay(), src, {comment:''});
  });
  db.employeeBaseSchedules[employeeId] = clean;
}
function timeOptionsHTML(selected){
  const step = precisionStep();
  let html = `<option value="" ${!selected?'selected':''}>--:--</option>`;
  let found = false;
  for(let h=0;h<24;h++){
    for(let m=0;m<60;m+=step){
      const val = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      if(val===selected) found = true;
      html += `<option value="${val}" ${selected===val?'selected':''}>${val}</option>`;
    }
  }
  if(selected && !found){
    html += `<option value="${selected}" selected>${selected} (hors grille)</option>`;
  }
  return html;
}
function fmtHoursColon(h){
  const totalMin = Math.round(h*60);
  const hh = Math.floor(totalMin/60), mm = totalMin%60;
  return hh+':'+String(mm).padStart(2,'0');
}

/* Saisie Heures + Minutes (jamais de décimal ambigu — 0.30 en décimal = 18 min, ce qui prête à confusion.
   Ici "0h" + "30min" = 30 minutes, sans surprise, partout dans l'app. */
function minutesSelectOptions(selectedMin){
  const opts = [0,15,30,45];
  return opts.map(m=>`<option value="${m}" ${Math.round(selectedMin)===m?'selected':''}>${String(m).padStart(2,'0')}</option>`).join('');
}
function hmInputsHTML(prefix, decimalHours, borderless){
  const totalMin = Math.round((decimalHours||0)*60);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  const roundedM = [0,15,30,45].reduce((best,cur)=>Math.abs(cur-m)<Math.abs(best-m)?cur:best, 0);
  const cls = borderless ? 'xl-input mono' : 'small mono';
  const hStyle = borderless ? 'width:34px;display:inline-block;text-align:right;' : 'width:56px;display:inline-block;';
  const mStyle = borderless ? 'width:48px;display:inline-block;' : 'width:64px;display:inline-block;';
  const hLabel = borderless ? 'h' : `<span class="helptext" style="margin:0 4px;">h</span>`;
  const mLabel = borderless ? 'min' : `<span class="helptext" style="margin-left:2px;">min</span>`;
  return `<input type="number" min="0" id="${prefix}-h" class="${cls}" style="${hStyle}" value="${h}">${hLabel}<select id="${prefix}-m" class="${cls}" style="${mStyle}">${minutesSelectOptions(roundedM)}</select>${mLabel}`;
}
function readHM(prefix){
  const hEl = document.getElementById(prefix+'-h');
  const mEl = document.getElementById(prefix+'-m');
  const h = hEl ? (parseInt(hEl.value,10)||0) : 0;
  const m = mEl ? (parseInt(mEl.value,10)||0) : 0;
  return h + m/60;
}

function recalcPlanningTotals(){
  let weekTotal = 0;
  DAYS_FR.forEach(day=>{
    const d = {};
    ['m1s','m1e','m2s','m2e','a1s','a1e','a2s','a2e'].forEach(f=>{
      const el = document.querySelector(`.time-select[data-day="${day}"][data-field="${f}"]`);
      d[f] = el ? el.value : '';
    });
    const t = dayTotal(d);
    weekTotal += t;
    const cell = document.querySelector(`[data-day-total="${day}"]`);
    if(cell) cell.textContent = fmtHoursColon(t);
  });
  const emp = db.employees.find(e=>e.id===planningState.employeeId);
  const base = emp ? (emp.baseHours||35) : 35;
  const suggestedSupp = Math.max(0, Math.round((weekTotal-base)*100)/100);
  const suppHEl = document.getElementById('pf-overtime-h');
  const suppMEl = document.getElementById('pf-overtime-m');
  if(suppHEl && suppMEl){
    const totalMin = Math.round(suggestedSupp*60);
    suppHEl.value = Math.floor(totalMin/60);
    const roundedM = [0,15,30,45].reduce((best,cur)=>Math.abs(cur-(totalMin%60))<Math.abs(best-(totalMin%60))?cur:best, 0);
    suppMEl.value = roundedM;
  }
  // Une modification de la grille reflète toujours le total RÉEL travaillé (jamais "gonflé" au niveau de la base
  // quand la semaine est en dessous de l'horaire de base — sinon on masquerait un manque d'heures).
  const totalEl = document.getElementById('planning-week-total');
  if(totalEl) totalEl.textContent = fmtHoursColon(weekTotal);
}
/* Appelée uniquement quand on édite le champ heures supp directement (pas quand on édite la grille) :
   là, on applique la règle demandée base + heures supp (permet par ex. de dire "en fait 2h payées, 2h récupérées"
   sans que ça touche à la grille). */
function updateHeuresEffectuees(){
  const emp = db.employees.find(e=>e.id===planningState.employeeId);
  const base = emp ? (emp.baseHours||35) : 35;
  const supp = readHM('pf-overtime');
  const totalEl = document.getElementById('planning-week-total');
  if(totalEl) totalEl.textContent = fmtHoursColon(base + supp);
}

async function handleScanFile(file, employeeId, weekStart, empName, secteur){
  if(!file) return;
  const MAX = 4*1024*1024;
  if(file.size > MAX){ showToast('Fichier trop volumineux (max 4 Mo).'); return; }
  const reader = new FileReader();
  reader.onload = async ()=>{
    const dataUrl = reader.result;
    try{
      await window.storage.set(scanKey(employeeId,weekStart), dataUrl, true);
    }catch(e){
      showToast('Erreur lors de l\u2019envoi du scan — réessaie.');
      return;
    }
    db.scannedSheets = db.scannedSheets.filter(s=>!(s.employeeId===employeeId && s.weekStart===weekStart));
    db.scannedSheets.push({
      employeeId, employeeName: empName, secteur, weekStart,
      filename: file.name, mime: file.type, sizeKB: Math.round(file.size/1024),
      uploadedBy: session.name, uploadedAt: new Date().toISOString()
    });
    addAudit('Scan ajouté', `Feuille signée envoyée pour ${empName} — semaine du ${fmtDate(weekStart)} (${file.name})`, {secteur, employeeName: empName});
    await saveDB();
    showToast('Scan enregistré.');
    render();
  };
  reader.onerror = ()=>{ showToast('Impossible de lire ce fichier.'); };
  reader.readAsDataURL(file);
}

          <a class="btn btn-ghost btn-sm" href="${url}" download="${esc(filename||'scan')}">Télécharger</a>
          <button class="btn btn-ghost btn-sm" id="scan-modal-close">Fermer ✕</button>
        </div>
      </div>
      <div class="scan-modal-body" id="scan-modal-body">
        ${isPdf ? `<div class="helptext" style="margin:auto;color:#fff;">Chargement du PDF…</div>` : `<img src="${url}">`}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=>{ overlay.remove(); URL.revokeObjectURL(url); };
  overlay.querySelector('#scan-modal-close').addEventListener('click', close);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });

  if(isPdf){
    const bodyEl = overlay.querySelector('#scan-modal-body');
    let modalFinished = false;
    const modalSafetyTimer = setTimeout(()=>{
      if(!modalFinished && overlay.isConnected){
        modalFinished = true;
        bodyEl.innerHTML = `<div class="helptext" style="margin:auto;color:#fff;text-align:center;">Ce fichier met trop de temps à s'afficher.<br>Clique sur "Télécharger" pour l'ouvrir directement.</div>`;
      }
    }, 25000);
    try{
      await withTimeout(ensurePdfJs(), 15000, 'chargement du lecteur PDF');
      const arrayBuffer = await blob.arrayBuffer();
      const pdf = await withTimeout(window.pdfjsLib.getDocument({data: arrayBuffer}).promise, 15000, 'ouverture du PDF');
      if(modalFinished) return;
      bodyEl.innerHTML = '';
      bodyEl.style.flexDirection = 'column';
      bodyEl.style.overflowY = 'auto';
      bodyEl.style.alignItems = 'center';
      bodyEl.style.padding = '16px';
      bodyEl.style.gap = '14px';
      let renderedCount = 0;
      for(let i=1; i<=pdf.numPages; i++){
        if(modalFinished) break;
        try{
          const page = await withTimeout(pdf.getPage(i), 8000, `page ${i}`);
          const viewport = page.getViewport({scale: 1.4});
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.style.background = '#fff';
          canvas.style.boxShadow = '0 2px 10px rgba(0,0,0,0.35)';
          canvas.style.maxWidth = '100%';
          const ctx = canvas.getContext('2d');
          await withTimeout(page.render({canvasContext: ctx, viewport}).promise, 10000, `rendu page ${i}`);
          bodyEl.appendChild(canvas);
          renderedCount++;
        }catch(pageErr){
          const errBox = document.createElement('div');
          errBox.className = 'helptext';
          errBox.style.color = '#fff';
          errBox.textContent = `Page ${i} : impossible à afficher (fichier au format inhabituel).`;
          bodyEl.appendChild(errBox);
        }
      }
      if(renderedCount===0) throw new Error('no page rendered');
    }catch(e){
      if(!modalFinished){
        bodyEl.innerHTML = '';
        bodyEl.style.flexDirection = 'row';
        const img = document.createElement('img');
        img.src = url;
        img.onerror = ()=>{
          bodyEl.innerHTML = `<div class="helptext" style="margin:auto;color:#fff;text-align:center;">Impossible d'afficher un aperçu de ce fichier ici — mais il n'est pas perdu.<br>Clique sur "Télécharger" pour l'ouvrir avec le lecteur de ton ordinateur.</div>`;
        };
        bodyEl.appendChild(img);
      }
    }
    if(!modalFinished){ modalFinished = true; clearTimeout(modalSafetyTimer); }
  }
}

function dataURLtoBlob(dataurl){
  const arr = dataurl.split(',');
  const mimeMatch = arr[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while(n--){ u8arr[n] = bstr.charCodeAt(n); }
  return new Blob([u8arr], {type: mime});
}

      const blob = dataURLtoBlob(res.value);

    let trashId = null;
    try{
      const res = await window.storage.get(scanKey(employeeId,weekStart), true);
      if(res && res.value){
        trashId = addToTrash('scan',
          {secteur, employeeName: empName, summary: meta ? meta.filename : 'Feuille signée'},
          {meta: meta || {employeeId, weekStart, employeeName: empName, secteur}, dataUrl: res.value});
      }
    }catch(e){ /* pas de scan à archiver */ }
    try{ await window.storage.delete(scanKey(employeeId,weekStart), true); }catch(e){ /* déjà absent, ignore */ }
    db.scannedSheets = db.scannedSheets.filter(s=>!(s.employeeId===employeeId && s.weekStart===weekStart));

/* Génère un PDF (Blob) du planning actuellement affiché à l'écran, en masquant les éléments techniques (colonne Copier, etc.) */
async function capturePlanningPdfBlob(){
  await withTimeout(ensureHtml2Canvas(), 15000, 'chargement de l\u2019outil PDF');
  await withTimeout(ensureJsPDF(), 15000, 'chargement de l\u2019outil PDF');
  const target = document.getElementById('printable-planning');
  const hiddenEls = Array.from(target.querySelectorAll('.no-print'));
  hiddenEls.forEach(el=>{ el.dataset.prevDisplay = el.style.display; el.style.display = 'none'; });
  let canvas;
  try{
    canvas = await withTimeout(window.html2canvas(target, {scale:2, backgroundColor:'#ffffff'}), 20000, 'capture du planning');
  } finally {
    hiddenEls.forEach(el=>{ el.style.display = el.dataset.prevDisplay || ''; delete el.dataset.prevDisplay; });
  }
  const imgData = canvas.toDataURL('image/jpeg', 0.92);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgRatio = canvas.height / canvas.width;
  let imgWidth = pageWidth - 40;
  let imgHeight = imgWidth * imgRatio;
  if(imgHeight > pageHeight - 40){ imgHeight = pageHeight - 40; imgWidth = imgHeight / imgRatio; }
  const x = (pageWidth - imgWidth) / 2;
  const y = 20;
  pdf.addImage(imgData, 'JPEG', x, y, imgWidth, imgHeight);
  return pdf.output('blob');
}

/* Appelée automatiquement après chaque enregistrement de semaine : génère et stocke le PDF, silencieusement (pas de bouton, pas de blocage si ça échoue). */
async function autoGeneratePlanningPdf(emp, weekStart){
  try{

    const dataUrl = await new Promise(resolve=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = ()=>resolve(null);
      reader.readAsDataURL(blob);
    });
    if(!dataUrl) return;
    await window.storage.set(planningPdfKey(emp.id, weekStart), dataUrl, true);
    const sheet = findSheet(emp.id, weekStart);

/* Synchronise l'entrée heures supp auto-liée à une feuille avec la valeur voulue (qu'elle vienne du calcul automatique ou d'une modification manuelle du champ). */
function syncOvertimeEntryForSheet(sheet, emp, weekStart, weekEnd, targetHours){
  targetHours = Math.round(targetHours*100)/100;
  let linkedEntry = sheet.autoOvertimeEntryId ? db.entries.find(e=>e.id===sheet.autoOvertimeEntryId) : null;
  let msg = '';
  if(targetHours > 0){
    if(linkedEntry){
      const oldHours = linkedEntry.hours;
      if(oldHours !== targetHours){
        linkedEntry.hours = targetHours;
        linkedEntry.date = weekEnd;
        linkedEntry.log = linkedEntry.log || [];
        linkedEntry.log.push({at: new Date().toISOString(), by: session.name, detail: `Heures ajustées : ${oldHours}h → ${targetHours}h (planning semaine du ${fmtDate(weekStart)})`});
        addAudit('Heures supp ajustées', `${emp.name} — ${oldHours}h → ${targetHours}h`, {secteur: emp.secteur, employeeName: emp.name, entryId: linkedEntry.id});
        msg = ` Heures supp mises à jour : ${fmtHours(targetHours)}.`;
      }
    } else {
      linkedEntry = {
        id: uid(), employeeId: emp.id, employeeName: emp.name, secteur: emp.secteur,
        type: 'heures_supp', date: weekEnd, hours: targetHours, decision: 'attente',
        comment: `Semaine du ${fmtDate(weekStart)} au ${fmtDate(weekEnd)}`,
        createdBy: session.name, createdAt: new Date().toISOString(),
        log: [{at: new Date().toISOString(), by: session.name, detail: `Entrée créée — ${targetHours}h`}]
      };
      db.entries.push(linkedEntry);
      sheet.autoOvertimeEntryId = linkedEntry.id;
      addAudit('Heures supp créées', `${emp.name} — ${targetHours}h, semaine du ${fmtDate(weekStart)}`, {secteur: emp.secteur, employeeName: emp.name, entryId: linkedEntry.id});
      msg = ` Heures supp enregistrées : ${fmtHours(targetHours)}.`;
    }
  } else if(linkedEntry){
    db.entries = db.entries.filter(e=>e.id!==linkedEntry.id);
    sheet.autoOvertimeEntryId = null;
    addAudit('Heures supp supprimées', `${emp.name} — entrée retirée (mise à 0 manuellement ou plus de dépassement)`, {secteur: emp.secteur, employeeName: emp.name});
    msg = ' Heures supp remises à zéro.';
  }
  return msg;
}

          JSON.parse(JSON.stringify(sheetToDelete)));
      }
      db.weeklySheets = db.weeklySheets.filter(s=>!(s.employeeId===planningState.employeeId && s.weekStart===planningState.weekStart));
      if(emp) addAudit('Planning supprimé', `${emp.name} — semaine du ${fmtDate(planningState.weekStart)} supprimée`, {secteur: emp.secteur, employeeName: emp.name, trashId});
      await saveDB();
      showToast('Planning supprimé (copie conservée pour Direction/RH).');
      render();
    });
  }

  document.querySelectorAll('[data-open-week]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      planningState.weekStart = btn.dataset.openWeek;
      render();
    });
  });
  document.querySelectorAll('[data-view-week-pdf]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const [empId, weekStart] = btn.dataset.viewWeekPdf.split('|');
      try{
        const res = await window.storage.get(planningPdfKey(empId, weekStart), true);
        if(!res || !res.value){ showToast('PDF introuvable — réenregistre la semaine pour le régénérer.'); return; }
        const blob = dataURLtoBlob(res.value);
        const emp2 = db.employees.find(e=>e.id===empId);
        showScanModal(blob, `planning_${emp2?emp2.name:''}_${weekStart}.pdf`);
      }catch(e){
        showToast('Impossible d\u2019ouvrir le PDF.');
      }
    });
  });
}

function currentYear(){ return new Date().getFullYear(); }

function congeUsedDays(employeeId){
  return db.conges
    .filter(c=>c.employeeId===employeeId && c.type==='Congés payés' && c.statut==='valide' && new Date(c.dateDebut).getFullYear()===currentYear())
    .reduce((s,c)=>s+c.days,0);
}

  if(congeFilters.statut !== 'Tous') conges = conges.filter(c=>c.statut===congeFilters.statut);

      <div class="field">

function attachCongesEvents(fixedSecteur){
  const full = fixedSecteur === null;

  const debutEl = document.getElementById('conge-debut');
  const finEl = document.getElementById('conge-fin');
  const preview = document.getElementById('conge-days-preview');
  function updatePreview(){
    if(!debutEl || !finEl || !preview) return;
    const d = businessDays(debutEl.value, finEl.value);
    preview.textContent = d>0 ? `Jours ouvrables (CP) : ${d}` : 'Jours ouvrables (CP) : —';
  }
  if(debutEl){ debutEl.addEventListener('change', updatePreview); finEl.addEventListener('change', updatePreview); }

  const saveBtn = document.getElementById('save-conge-btn');
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      const employeeId = document.getElementById('conge-employee').value;
      const emp = db.employees.find(e=>e.id===employeeId);
      const type = document.getElementById('conge-type').value;
      const dateDebut = debutEl.value;
      const dateFin = finEl.value;
      const comment = document.getElementById('conge-comment').value.trim();
      if(!dateDebut || !dateFin){ showToast('Choisis les dates de début et de fin.'); return; }
      const days = businessDays(dateDebut, dateFin);
      if(days<=0){ showToast('La date de fin doit être après la date de début.'); return; }

      // Règle de validation :
      // - Direction/RH : toute demande est validée directement.
      // - Responsable : CP d'un salarié standard = validé automatiquement ; CP d'un autre responsable = doit être validé par Direction/RH.
      //   Les autres types de congés (RTT, sans solde, maladie, autre) restent toujours en attente de validation.
      let statut = 'attente';
      let autoNote = '';
      if(isFullAccess()){
        statut = 'valide';
        autoNote = ' — validé directement (saisi par ' + roleLabel(session.role) + ')';
      } else if(type === 'Congés payés' && emp && !emp.isManager){
        statut = 'valide';
        autoNote = ' — validé automatiquement (salarié standard, saisi par le responsable)';
      }

      const conge = {
        id: uid(), employeeId, employeeName: emp?emp.name:'?', secteur: emp?emp.secteur:fixedSecteur,
        type, dateDebut, dateFin, days, statut, comment,
        createdBy: session.name, createdAt: new Date().toISOString()
      };
      db.conges.push(conge);
      addAudit('Demande de congé', `${conge.employeeName} — ${type} du ${fmtDate(dateDebut)} au ${fmtDate(dateFin)} (${days} j)${autoNote}`, {secteur: conge.secteur, employeeName: conge.employeeName});
      await saveDB();
      showToast(statut==='valide' ? 'Congé enregistré et validé.' : 'Demande enregistrée, en attente de validation.');
      render();
    });
  }

  document.querySelectorAll('[data-alloc-emp]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const emp = db.employees.find(e=>e.id===inp.dataset.allocEmp);
      if(!emp) return;
      const val = parseInt(inp.value,10);
      if(isNaN(val) || val<0){ showToast('Valeur invalide.'); return; }
      const old = emp.leaveAllocation || DEFAULT_ALLOCATION;
      emp.leaveAllocation = val;
      if(old !== val) addAudit('Solde congés modifié', `${emp.name} : ${old} j → ${val} j acquis`, {secteur: emp.secteur, employeeName: emp.name});
      await saveDB();
      showToast('Jours acquis mis à jour.');
    });
  });

  const secteurFilterSel = document.getElementById('conge-filter-secteur');
  if(secteurFilterSel) secteurFilterSel.addEventListener('change', ()=>{ congeFilters.secteur = secteurFilterSel.value; render(); });
  document.getElementById('conge-filter-statut').addEventListener('change', e=>{ congeFilters.statut = e.target.value; render(); });

  document.querySelectorAll('[data-conge-valide]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const c = db.conges.find(x=>x.id===btn.dataset.congeValide);
      if(c){
        c.statut = 'valide';
        addAudit('Congé validé', `${c.employeeName} — ${c.type} du ${fmtDate(c.dateDebut)} au ${fmtDate(c.dateFin)} validé`, {secteur:c.secteur, employeeName:c.employeeName});
        await saveDB();
        showToast('Congé validé.');
        render();
      }
    });
  });
  document.querySelectorAll('[data-conge-refuse]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const c = db.conges.find(x=>x.id===btn.dataset.congeRefuse);
      if(c){
        c.statut = 'refuse';
        addAudit('Congé refusé', `${c.employeeName} — ${c.type} du ${fmtDate(c.dateDebut)} au ${fmtDate(c.dateFin)} refusé`, {secteur:c.secteur, employeeName:c.employeeName});
        await saveDB();
        showToast('Congé refusé.');
        render();
      }
    });
  });
}

let overtimeState = { year: new Date().getFullYear(), secteur: 'Toutes' };
const MONTH_SHORT_FR = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];

function overtimeMonthlyData(employeeId, year){
  const months = new Array(12).fill(0);
  db.entries
    .filter(e=>e.type==='heures_supp' && e.employeeId===employeeId)
    .forEach(e=>{
      const d = new Date(e.date+'T00:00:00');
      if(!isNaN(d) && d.getFullYear()===year){
        months[d.getMonth()] += Number(e.hours||0);
      }
    });
  return months;
}

function viewOvertimeHTML(fixedSecteur){
  const full = fixedSecteur === null;
  if(!full) overtimeState.secteur = fixedSecteur;
  const emps = full
    ? (overtimeState.secteur==='Toutes' ? db.employees : db.employees.filter(e=>e.secteur===overtimeState.secteur))
    : db.employees.filter(e=>e.secteur===fixedSecteur);

  const limit = db.overtimeAnnualLimit || 180;
  const warnThreshold = limit * 0.7;

  const rows = emps.map(e=>{
    const months = overtimeMonthlyData(e.id, overtimeState.year);
    const total = months.reduce((s,v)=>s+v,0);
    const totalClass = total>=limit ? 'over' : total>=warnThreshold ? 'warn' : 'ok';
    return {emp:e, months, total, totalClass};
  }).sort((a,b)=>b.total-a.total);

  const alerts = rows.filter(r=>r.total>=warnThreshold);

  const secteurOptions = full ? `<option value="Toutes" ${overtimeState.secteur==='Toutes'?'selected':''}>Tous les secteurs</option>` +
    SECTEURS.map(s=>`<option value="${s}" ${overtimeState.secteur===s?'selected':''}>${s}</option>`).join('') : '';

  const yearOptions = [];
  const nowY = new Date().getFullYear();
  for(let y=nowY+1; y>=nowY-3; y--) yearOptions.push(`<option value="${y}" ${overtimeState.year===y?'selected':''}>${y}</option>`);

  return `
  ${alerts.length ? `
  <div class="ot-alert-banner">
    <h2>⚠️ Employés proches ou au-delà du plafond annuel (${limit}h)</h2>
    ${alerts.map(r=>`<div class="ot-alert-item"><strong>${esc(r.emp.name)}</strong> (${r.emp.secteur}) — <span class="ot-total ${r.totalClass}">${fmtHours(r.total)}</span> sur ${limit}h ${r.total>=limit ? '— PLAFOND DÉPASSÉ' : '— à surveiller'}</div>`).join('')}
  </div>` : ''}

  <div class="card">
    <div class="list-header">
      <h2 style="margin:0;">Heures supplémentaires — suivi annuel</h2>
      <div class="row-inline" style="margin:0;">
        ${full ? `<select id="ot-secteur" class="small">${secteurOptions}</select>` : ''}
        <select id="ot-year" class="small">${yearOptions.join('')}</select>
      </div>
    </div>
    <p class="helptext">Cumul automatique de toutes les heures supp saisies dans Nouvelle entrée / Planning, mois par mois. Plafond légal annuel réglable dans Paramètres (RH) — actuellement <strong>${limit}h</strong>.</p>
    <div class="table-scroll">
      <table class="ot-table">
        <thead>
          <tr>
            <th>Employé</th>${full?'<th>Secteur</th>':''}
            ${MONTH_SHORT_FR.map(m=>`<th>${m}</th>`).join('')}
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
          ${rows.length ? rows.map(r=>`
          <tr>
            <td>${esc(r.emp.name)}</td>
            ${full?`<td>${r.emp.secteur}</td>`:''}
            ${r.months.map(v=>`<td class="ot-month ${v>0?'has-hours':''}">${v>0?fmtHours(v):'—'}</td>`).join('')}
            <td class="ot-total ${r.totalClass}">${fmtHours(r.total)}</td>
          </tr>`).join('') : `<tr><td colspan="${full?15:14}">${emptyHTML('Aucun employé.')}</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>
  `;
}

/* ---------------- CALENDRIER DES CONGÉS ---------------- */
let calendarState = { year: new Date().getFullYear(), month: new Date().getMonth(), secteur: 'Toutes' };
const CAL_COLORS = ['#3F7856','#7A4A9E','#B5452B','#4A7A9E','#B5822A','#5B4488','#2E6DA4','#8A6D3B','#C97A2B','#3F5D7D','#6B8E23','#A0527A'];
function employeeColorFor(id){
  let hash = 0;
  for(let i=0;i<id.length;i++){ hash = (hash*31 + id.charCodeAt(i)) >>> 0; }
  return CAL_COLORS[hash % CAL_COLORS.length];
}
const MONTH_NAMES_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function viewCalendarHTML(fixedSecteur){
  const full = fixedSecteur === null;
  if(!full) calendarState.secteur = fixedSecteur;

  const year = calendarState.year, month = calendarState.month;
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay()+6)%7; // Lundi=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const gridStart = new Date(year, month, 1 - startOffset);
  const totalCells = Math.ceil((startOffset+daysInMonth)/7)*7;

  let conges = db.conges.filter(c=>c.statut==='valide' || c.statut==='attente');
  if(full){
    if(calendarState.secteur !== 'Toutes') conges = conges.filter(c=>c.secteur===calendarState.secteur);
  } else {
    conges = conges.filter(c=>c.secteur===fixedSecteur);
  }
  const byColorGlobal = full && calendarState.secteur==='Toutes';
  const todayStr = ymd(new Date());

  const secteurOptions = full ? `<option value="Toutes" ${calendarState.secteur==='Toutes'?'selected':''}>Tous les secteurs</option>` +
    SECTEURS.map(s=>`<option value="${s}" ${calendarState.secteur===s?'selected':''}>${s}</option>`).join('') : '';

  const weekdayHeaders = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div class="cal-weekday">${d}</div>`).join('');

  let cells = '';
  for(let i=0;i<totalCells;i++){
    const cellDate = addDays(gridStart, i);
    const cellStr = ymd(cellDate);
    const inMonth = cellDate.getMonth()===month;
    const holiday = isHoliday(cellStr) ? frenchHolidays(cellDate.getFullYear()).find(h=>h.date===cellStr) : null;
    const dayConges = conges.filter(c=>c.dateDebut<=cellStr && c.dateFin>=cellStr);
    const chips = dayConges.slice(0,4).map(c=>{
      const bg = byColorGlobal ? SECTEUR_COLOR[c.secteur] : employeeColorFor(c.employeeId);
      const label = byColorGlobal ? `${c.employeeName} (${c.secteur.slice(0,2)})` : c.employeeName;
      return `<div class="cal-chip ${c.statut==='attente'?'attente':''}" style="background:${bg};" title="${esc(c.employeeName)} — ${esc(c.type)} (${CONGE_STATUT_LABELS[c.statut]})">${esc(label)}</div>`;
    }).join('');
    const overflow = dayConges.length>4 ? `<div class="cal-chip" style="background:var(--ink-soft);">+${dayConges.length-4}</div>` : '';
    cells += `<div class="cal-day ${inMonth?'':'other-month'} ${cellStr===todayStr?'is-today':''}">
      <div class="cal-daynum">${cellDate.getDate()}</div>
      ${holiday ? `<div class="cal-holiday-lbl">${esc(holiday.label)}</div>` : ''}
      ${chips}${overflow}
    </div>`;
  }

  // légende
  let legendItems;
  if(byColorGlobal){
    legendItems = SECTEURS.map(s=>`<div class="cal-legend-item"><span class="cal-legend-dot" style="background:${SECTEUR_COLOR[s]};"></span>${s}</div>`).join('');
  } else {
    const empIds = [...new Set(conges.map(c=>c.employeeId))];
    legendItems = empIds.map(id=>{
      const c = conges.find(x=>x.employeeId===id);
      return `<div class="cal-legend-item"><span class="cal-legend-dot" style="background:${employeeColorFor(id)};"></span>${esc(c.employeeName)}</div>`;
    }).join('') || '<span class="helptext">Aucun congé ce mois-ci.</span>';
  }

  return `
  <div class="card">
    <div class="cal-header">
      <button class="btn btn-ghost btn-sm" id="cal-prev">← Mois préc.</button>
      <div class="cal-month-label">${MONTH_NAMES_FR[month]} ${year}</div>
      <button class="btn btn-ghost btn-sm" id="cal-next">Mois suiv. →</button>
      <button class="btn btn-ghost btn-sm" id="cal-today">Aujourd'hui</button>
      ${full ? `<select id="cal-secteur" class="small">${secteurOptions}</select>` : ''}
    </div>
    <div class="cal-grid">
      ${weekdayHeaders}
      ${cells}
    </div>
    <div class="cal-legend">${legendItems}</div>
    <p class="helptext" style="margin-top:10px;">Les congés à motifs hachurés sont encore <strong>en attente</strong> de validation. Les jours fériés sont indiqués en haut de la case.</p>
  </div>
  `;
}

function attachCalendarEvents(fixedSecteur){
  document.getElementById('cal-prev').addEventListener('click', ()=>{
    calendarState.month--;
    if(calendarState.month<0){ calendarState.month=11; calendarState.year--; }
    render();
  });
  document.getElementById('cal-next').addEventListener('click', ()=>{
    calendarState.month++;
    if(calendarState.month>11){ calendarState.month=0; calendarState.year++; }
    render();
  });
  document.getElementById('cal-today').addEventListener('click', ()=>{
    const now = new Date();
    calendarState.year = now.getFullYear();
    calendarState.month = now.getMonth();
    render();
  });
  const secteurSel = document.getElementById('cal-secteur');
  if(secteurSel) secteurSel.addEventListener('change', ()=>{ calendarState.secteur = secteurSel.value; render(); });
}

function loadScriptOnce(src){
  if(_scriptLoadPromises[src]) return _scriptLoadPromises[src];
  _scriptLoadPromises[src] = new Promise((resolve,reject)=>{
    const existing = document.querySelector(`script[src="${src}"]`);
    if(existing){
      existing.addEventListener('load', ()=>resolve());
      existing.addEventListener('error', ()=>reject(new Error('load failed: '+src)));
      return;
    }
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('load failed: '+src));
    document.head.appendChild(s);
  });
  return _scriptLoadPromises[src];
}
let _pdfJsWorkerSet = false;
async function ensurePdfJs(){
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  if(!_pdfJsWorkerSet){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    _pdfJsWorkerSet = true;
  }
}
