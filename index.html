function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=>reject(new Error(`Délai dépassé — ${label}`)), ms))
  ]);
}

async function splitPdfIntoQueue(file, pool){
  pdfSplitBusy = true;
  pdfSplitSourceName = file.name;
  pdfSplitQueue = [];
  render();
  let failedPages = 0;
  let finished = false;

  // Filet de sécurité absolu : quoi qu'il arrive, on débloque l'écran après 45s max
  const safetyTimer = setTimeout(()=>{
    if(!finished){
      finished = true;
      pdfSplitBusy = false;
      showToast('Ce fichier prend trop de temps à traiter et a été interrompu. Essaie de le rescanner en couleur/niveaux de gris JPEG (moins courant en noir et blanc/fax), ou envoie-le tel quel via "Choisir des fichiers" ci-dessus — il pourra toujours être téléchargé même sans aperçu.');
      render();
    }
  }, 45000);

  try{
    await withTimeout(ensurePdfJs(), 15000, 'chargement du lecteur PDF');
    const arrayBuffer = await withTimeout(file.arrayBuffer(), 10000, 'lecture du fichier');
    const pdf = await withTimeout(window.pdfjsLib.getDocument({data: arrayBuffer}).promise, 20000, 'ouverture du PDF');
    for(let i=1; i<=pdf.numPages; i++){
      try{
        const page = await withTimeout(pdf.getPage(i), 10000, `chargement page ${i}`);
        const viewport = page.getViewport({scale: 1.4});
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        await withTimeout(page.render({canvasContext: ctx, viewport}).promise, 12000, `rendu page ${i}`);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);

        let extractedText = '';
        try{
          const textContent = await withTimeout(page.getTextContent(), 5000, `texte page ${i}`);
          extractedText = textContent.items.map(it=>it.str).join(' ');
        }catch(e){ /* page image pure, pas de texte — normal pour un scan papier */ }

        const guess = guessEmployeeForFilename(extractedText, pool);
        pdfSplitQueue.push({
          pageNum: i,
          dataUrl,
          employeeId: guess ? guess.id : '',
          weekStart: guessWeekForFilename(extractedText || ''),
          hasText: extractedText.trim().length > 0
        });
      }catch(pageErr){
        failedPages++;
        pdfSplitQueue.push({
          pageNum: i,
          dataUrl: '',
          employeeId: '',
          weekStart: ymd(mondayOf(new Date())),
          hasText: false,
          renderFailed: true
        });
      }
      if(finished) break; // le filet de sécurité a déjà coupé, on arrête proprement
      pdfSplitBusy = 'page ' + i + '/' + pdf.numPages;
      render();
    }
  }catch(e){
    if(!finished) showToast('Impossible de lire ce PDF. ('+e.message+') — utilise "Choisir des fichiers" pour l\u2019envoyer tel quel à la place.');
  }
  if(!finished){
    finished = true;
    clearTimeout(safetyTimer);
    pdfSplitBusy = false;
    if(failedPages>0) showToast(`${failedPages} page(s) n'ont pas pu être ouvertes (format inhabituel) — les autres sont prêtes.`);
    render();
  }
}


function normalizeNameTokens(str){
  return str.toUpperCase()
    .replace(/\.[A-Z0-9]+$/,'')
    .replace(/[_\-]+/g,' ')
    .replace(/\d+/g,' ')
    .replace(/[^A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜÇ' ]/g,' ')
    .split(/\s+/)
    .filter(w=>w.length>1);
}

function guessEmployeeForFilename(filename, pool){
  const fileTokens = new Set(normalizeNameTokens(filename));
  let best = null, bestScore = 0;
  pool.forEach(emp=>{
    const empTokens = normalizeNameTokens(emp.name);
    let score = 0;
    empTokens.forEach(t=>{ if(fileTokens.has(t)) score++; });
    if(score > bestScore){ bestScore = score; best = emp; }
  });
  return best;
}

function mondayFromISOWeek(year, week){
  const jan4 = new Date(year,0,4);
  const jan4Day = (jan4.getDay()+6)%7;
  const week1Monday = addDays(jan4, -jan4Day);
  return addDays(week1Monday, (week-1)*7);
}

function guessWeekForFilename(filename){
  const dateMatch = filename.match(/(20\d{2})[-_]?(\d{2})[-_]?(\d{2})/);
  if(dateMatch){
    const d = new Date(parseInt(dateMatch[1]), parseInt(dateMatch[2])-1, parseInt(dateMatch[3]));
    if(!isNaN(d)) return ymd(mondayOf(d));
  }
  const weekMatch = filename.match(/S[ ._-]?(\d{1,2})\b/i);
  if(weekMatch){
    const w = parseInt(weekMatch[1],10);
    if(w>=1 && w<=53) return ymd(mondayFromISOWeek(new Date().getFullYear(), w));
  }
  return ymd(mondayOf(new Date()));
}

/* Parcours récursif d'un dossier déposé (API FileSystemEntry) — plus fiable que le sélecteur natif "dossier" */
function readDirEntries(dirReader){
  return new Promise(resolve=>{
    dirReader.readEntries(entries=>resolve(entries));
  });
}
async function traverseEntry(entry){
  if(!entry) return [];
  if(entry.isFile){
    return new Promise(resolve=>{ entry.file(file=>resolve([file]), ()=>resolve([])); });
  }
  if(entry.isDirectory){
    const reader = entry.createReader();
    let allFiles = [];
    let batch;
    do{
      batch = await readDirEntries(reader);
      for(const child of batch){
        const found = await traverseEntry(child);
        allFiles = allFiles.concat(found);
      }
    } while(batch.length>0);
    return allFiles;
  }
  return [];
}
async function filesFromDataTransfer(dataTransfer){
  const items = dataTransfer.items;
  if(items && items.length && items[0].webkitGetAsEntry){
    let files = [];
    const entries = [];
    for(let i=0;i<items.length;i++){
      const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
      if(entry) entries.push(entry);
    }
    for(const entry of entries){
      const found = await traverseEntry(entry);
      files = files.concat(found);
    }
    if(files.length>0) return files;
  }
  return Array.from(dataTransfer.files || []);
}

function attachDocumentsEvents(fixedSecteur){
  const full = fixedSecteur === null;
  const pool = full ? db.employees : db.employees.filter(e=>e.secteur===fixedSecteur);

  function queueFiles(fileList){
    let skippedType = 0, skippedSize = 0, added = 0;
    Array.from(fileList).forEach(file=>{
      const isImage = file.type.startsWith('image/');
      const isPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name);
      if(!isImage && !isPdf){ skippedType++; return; }
      if(file.size > 4*1024*1024){ skippedSize++; return; }
      const guess = guessEmployeeForFilename(file.name, pool);
      bulkImportQueue.push({
        fileObj: file, filename: file.name,
        employeeId: guess ? guess.id : '',
        weekStart: guessWeekForFilename(file.name)
      });
      added++;
    });
    let msg = `${added} fichier(s) ajouté(s) à la liste.`;
    if(skippedSize>0) msg += ` ${skippedSize} ignoré(s) (trop volumineux).`;
    if(skippedType>0) msg += ` ${skippedType} ignoré(s) (pas une image/PDF).`;
    showToast(msg);
    render();
  }

  document.getElementById('bulk-scan-input').addEventListener('change', (e)=>{ queueFiles(e.target.files); });
  document.getElementById('bulk-scan-folder-input').addEventListener('change', (e)=>{ queueFiles(e.target.files); });

  const dropZone = document.getElementById('drop-zone');
  if(dropZone){
    ['dragenter','dragover'].forEach(evt=>{
      dropZone.addEventListener(evt, e=>{ e.preventDefault(); e.stopPropagation(); dropZone.classList.add('drag-over'); });
    });
    ['dragleave','drop'].forEach(evt=>{
      dropZone.addEventListener(evt, e=>{ e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('drag-over'); });
    });
    dropZone.addEventListener('drop', async e=>{
      const files = await filesFromDataTransfer(e.dataTransfer);
      if(files.length===0){ showToast('Aucun fichier détecté dans le dépôt.'); return; }
      queueFiles(files);
    });
  }

  document.querySelectorAll('.bulk-emp-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{ bulkImportQueue[sel.dataset.idx].employeeId = sel.value; });
  });
  document.querySelectorAll('.bulk-week-input').forEach(inp=>{
    inp.addEventListener('change', ()=>{ bulkImportQueue[inp.dataset.idx].weekStart = ymd(mondayOf(new Date(inp.value+'T00:00:00'))); });
  });
  document.querySelectorAll('[data-remove-queue]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      bulkImportQueue.splice(parseInt(btn.dataset.removeQueue,10),1);
      render();
    });
  });

  const clearBtn = document.getElementById('bulk-clear-btn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ bulkImportQueue = []; render(); });

  const importBtn = document.getElementById('bulk-import-btn');
  if(importBtn) importBtn.addEventListener('click', async ()=>{
    const missing = bulkImportQueue.filter(item=>!item.employeeId).length;
    if(missing>0){ showToast(`${missing} fichier(s) sans employé choisi — corrige avant d'importer.`); return; }
    importBtn.disabled = true;
    importBtn.textContent = 'Import en cours…';
    let okCount = 0;
    for(const item of bulkImportQueue){
      const emp = db.employees.find(e=>e.id===item.employeeId);
      if(!emp) continue;
      let dataUrl = item.dataUrl;
      if(!dataUrl && item.fileObj){
        dataUrl = await new Promise(resolve=>{
          const reader = new FileReader();
          reader.onload = ()=>resolve(reader.result);
          reader.onerror = ()=>resolve(null);
          reader.readAsDataURL(item.fileObj);
        });
      }
      if(!dataUrl) continue;
      try{
        await window.storage.set(scanKey(emp.id, item.weekStart), dataUrl, true);
      }catch(e){ continue; }
      db.scannedSheets = db.scannedSheets.filter(s=>!(s.employeeId===emp.id && s.weekStart===item.weekStart));
      db.scannedSheets.push({
        employeeId: emp.id, employeeName: emp.name, secteur: emp.secteur, weekStart: item.weekStart,
        filename: item.filename,
        mime: item.fileObj ? item.fileObj.type : 'image/jpeg',
        sizeKB: item.fileObj ? Math.round(item.fileObj.size/1024) : (item.sizeKB || Math.round(dataUrl.length*0.75/1024)),
        uploadedBy: session.name, uploadedAt: new Date().toISOString()
      });
      okCount++;
    }
    addAudit('Import groupé', `${okCount} feuille(s) scannée(s) importée(s) par ${session.name}`, {secteur: fixedSecteur||''});
    await saveDB();
    bulkImportQueue = [];
    showToast(`${okCount} fichier(s) importé(s).`);
    render();
  });

  const pdfInput = document.getElementById('pdf-split-input');
  if(pdfInput) pdfInput.addEventListener('change', ()=>{
    const file = pdfInput.files[0];
    if(!file) return;
    if(file.size > 25*1024*1024){ showToast('PDF trop volumineux (max 25 Mo avant découpage).'); return; }
    splitPdfIntoQueue(file, pool);
  });

  document.querySelectorAll('[data-pdf-thumb]').forEach(img=>{
    img.addEventListener('click', ()=>{
      const item = pdfSplitQueue[img.dataset.pdfThumb];
      if(item) showScanModal(dataURLtoBlob(item.dataUrl), `Page ${item.pageNum}`);
    });
  });
  document.querySelectorAll('[data-pdf-thumb-btn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = pdfSplitQueue[btn.dataset.pdfThumbBtn];
      if(item) showScanModal(dataURLtoBlob(item.dataUrl), `Page ${item.pageNum}`);
    });
  });
  document.querySelectorAll('.pdf-emp-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{ pdfSplitQueue[sel.dataset.idx].employeeId = sel.value; });
  });
  document.querySelectorAll('.pdf-week-input').forEach(inp=>{
    inp.addEventListener('change', ()=>{ pdfSplitQueue[inp.dataset.idx].weekStart = ymd(mondayOf(new Date(inp.value+'T00:00:00'))); });
  });
  document.querySelectorAll('[data-remove-pdf-page]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      pdfSplitQueue.splice(parseInt(btn.dataset.removePdfPage,10),1);
      render();
    });
  });

  const pdfClearBtn = document.getElementById('pdf-split-clear-btn');
  if(pdfClearBtn) pdfClearBtn.addEventListener('click', ()=>{ pdfSplitQueue = []; pdfSplitSourceName = ''; render(); });

  const pdfImportBtn = document.getElementById('pdf-split-import-btn');
  if(pdfImportBtn) pdfImportBtn.addEventListener('click', async ()=>{
    const toImport = pdfSplitQueue.filter(item=>item.employeeId && !item.renderFailed);
    if(toImport.length===0){ showToast('Choisis au moins un employé sur une page avant d\u2019importer.'); return; }
    pdfImportBtn.disabled = true;
    pdfImportBtn.textContent = 'Import en cours…';
    let okCount = 0;
    for(const item of toImport){
      const emp = db.employees.find(e=>e.id===item.employeeId);
      if(!emp) continue;
      try{
        await window.storage.set(scanKey(emp.id, item.weekStart), item.dataUrl, true);
      }catch(e){ continue; }
      db.scannedSheets = db.scannedSheets.filter(s=>!(s.employeeId===emp.id && s.weekStart===item.weekStart));
      db.scannedSheets.push({
        employeeId: emp.id, employeeName: emp.name, secteur: emp.secteur, weekStart: item.weekStart,
        filename: `${pdfSplitSourceName} — page ${item.pageNum}`, mime: 'image/jpeg',
        sizeKB: Math.round(item.dataUrl.length*0.75/1024),
        uploadedBy: session.name, uploadedAt: new Date().toISOString()
      });
      okCount++;
    }
    addAudit('Import PDF multi-pages', `${okCount} page(s) importée(s) depuis "${pdfSplitSourceName}" par ${session.name}`, {secteur: fixedSecteur||''});
    await saveDB();
    const remaining = pdfSplitQueue.filter(item=>!item.employeeId);
    pdfSplitQueue = remaining;
    if(pdfSplitQueue.length===0) pdfSplitSourceName = '';
    const skipped = pdfSplitQueue.length;
    showToast(`${okCount} page(s) importée(s).` + (skipped>0 ? ` ${skipped} page(s) restée(s) en attente (pas d'employé choisi).` : ''));
    render();
  });

  document.querySelectorAll('[data-doc-view]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        const res = await window.storage.get(btn.dataset.docView, true);
        if(!res || !res.value){ showToast('Scan introuvable.'); return; }
        const blob = dataURLtoBlob(res.value);
        showScanModal(blob, btn.dataset.docFilename);
      }catch(e){ showToast('Impossible d\u2019ouvrir le scan.'); }
    });
  });
  document.querySelectorAll('[data-doc-download]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        const res = await window.storage.get(btn.dataset.docDownload, true);
        if(!res || !res.value){ showToast('Scan introuvable.'); return; }
        const blob = dataURLtoBlob(res.value);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = btn.dataset.docDownloadFilename || 'scan';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }catch(e){ showToast('Impossible de télécharger ce scan.'); }
    });
  });
  const scanFilterSel = document.getElementById('scan-filter-emp');
  if(scanFilterSel) scanFilterSel.addEventListener('change', ()=>{ scanFilterEmployee = scanFilterSel.value; render(); });

  const zipBtn = document.getElementById('scan-download-zip-btn');
  if(zipBtn) zipBtn.addEventListener('click', async ()=>{
    let scans = full ? [...db.scannedSheets] : db.scannedSheets.filter(s=>s.secteur===fixedSecteur);
    if(scanFilterEmployee!=='Tous') scans = scans.filter(s=>s.employeeId===scanFilterEmployee);
    if(scans.length===0){ showToast('Rien à télécharger.'); return; }
    zipBtn.disabled = true;
    zipBtn.textContent = 'Préparation du ZIP…';
    try{
      await ensureJSZip();
      const zip = new window.JSZip();
      const usedNames = {};
      for(const s of scans){
        const res = await window.storage.get(scanKey(s.employeeId, s.weekStart), true);
        if(!res || !res.value) continue;
        const blob = dataURLtoBlob(res.value);
        let base = `${s.employeeName} — ${s.weekStart} — ${s.filename}`.replace(/[\\/:*?"<>|]/g,'-');
        if(usedNames[base]){ usedNames[base]++; base = base + ' (' + usedNames[base] + ')'; } else { usedNames[base]=1; }
        zip.file(base, blob);
      }
      const zipBlob = await zip.generateAsync({type:'blob'});
      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = url;
      const zipName = scanFilterEmployee==='Tous' ? `scans_${fixedSecteur||'tous'}.zip` : `scans_${scans[0].employeeName}.zip`;
      a.download = zipName.replace(/\s+/g,'_');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`${scans.length} scan(s) téléchargé(s) en ZIP.`);
    }catch(e){
      showToast('Impossible de générer le ZIP.');
    }
    zipBtn.disabled = false;
    zipBtn.textContent = 'Télécharger la sélection (ZIP)';
  });

  document.querySelectorAll('[data-doc-delete-emp]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!(await customConfirm('Supprimer ce scan ? Une copie sera conservée pour Direction/RH.'))) return;
      const empId = btn.dataset.docDeleteEmp, weekStart = btn.dataset.docDeleteWeek;
      const meta = db.scannedSheets.find(s=>s.employeeId===empId && s.weekStart===weekStart);
      let trashId = null;
      try{
        const res = await window.storage.get(scanKey(empId, weekStart), true);
        if(res && res.value){
          trashId = addToTrash('scan',
            {secteur: meta?meta.secteur:'', employeeName: meta?meta.employeeName:'', summary: meta ? meta.filename : 'Feuille signée'},
            {meta: meta || {employeeId:empId, weekStart}, dataUrl: res.value});
        }
      }catch(e){ /* pas de scan à archiver */ }
      try{ await window.storage.delete(scanKey(empId, weekStart), true); }catch(e){}
      db.scannedSheets = db.scannedSheets.filter(s=>!(s.employeeId===empId && s.weekStart===weekStart));
      if(meta) addAudit('Scan supprimé', `Feuille signée retirée pour ${meta.employeeName} — semaine du ${fmtDate(weekStart)}`, {secteur: meta.secteur, employeeName: meta.employeeName, trashId});
      await saveDB();
      showToast('Scan supprimé (copie conservée pour Direction/RH).');
      render();
    });
  });
}

/* ---------------- JOURNAL (audit log, direction/RH only) ---------------- */
function viewJournalHTML(){
  let log = [...db.auditLog];
  if(journalFilters.secteur !== 'Toutes') log = log.filter(l=>l.secteur===journalFilters.secteur);
  if(journalFilters.action !== 'Toutes') log = log.filter(l=>l.action===journalFilters.action);
  log.sort((a,b)=> (b.at||'').localeCompare(a.at||''));

  const actionTypes = [...new Set(db.auditLog.map(l=>l.action))];
  const actionOptions = `<option value="Toutes">Toutes les actions</option>` + actionTypes.map(a=>`<option value="${a}" ${journalFilters.action===a?'selected':''}>${a}</option>`).join('');
  const secteurOptions = `<option value="Toutes">Tous les secteurs</option>` + SECTEURS.map(s=>`<option value="${s}" ${journalFilters.secteur===s?'selected':''}>${s}</option>`).join('');

  return `
  <div class="card">
    <h2>Journal des modifications</h2>
    <p class="helptext">Toutes les créations, changements de décision, suppressions et actions congés, avec l'auteur et l'horodatage. Les suppressions par un responsable peuvent être restaurées.</p>
    <div class="row-inline" style="margin:14px 0;">
      <select id="journal-filter-secteur" class="small">${secteurOptions}</select>
      <select id="journal-filter-action" class="small">${actionOptions}</select>
    </div>
    ${log.length ? log.map(l=>{
      const trashItem = l.trashId ? db.trash.find(t=>t.id===l.trashId) : null;
      const canRestore = trashItem && !trashItem.restored;
      return `
      <div class="journal-row">
        <div class="jdot"></div>
        <div class="jbody">
          <div class="jaction">${esc(l.action)}${l.secteur ? ' · '+l.secteur : ''}</div>
          <div class="jdetail">${esc(l.detail)}</div>
          <div class="jmeta">${fmtDateTime(l.at)} — par ${esc(l.by)} (${esc(l.role)})${trashItem && trashItem.restored ? ` · <span style="color:var(--success);">restauré le ${fmtDateTime(trashItem.restoredAt)}</span>` : ''}</div>
        </div>
        ${canRestore ? `<button class="btn btn-success btn-sm" data-restore-trash="${trashItem.id}">↺ Restaurer</button>` : ''}
      </div>`;
    }).join('') : emptyHTML('Aucune activité enregistrée pour ces filtres.')}
  </div>
  `;
}

async function restoreTrashItem(trashId){
  const item = db.trash.find(t=>t.id===trashId);
  if(!item || item.restored) return;
  if(item.type==='planning'){
    db.weeklySheets = db.weeklySheets.filter(s=>!(s.employeeId===item.data.employeeId && s.weekStart===item.data.weekStart));
    db.weeklySheets.push(item.data);
  } else if(item.type==='entry'){
    db.entries = db.entries.filter(e=>e.id!==item.data.id);
    db.entries.push(item.data);
    if(item.data.scheduleSnapshot){
      const snap = item.data.scheduleSnapshot;
      const sheet = db.weeklySheets.find(s=>s.employeeId===item.data.employeeId && s.weekStart===snap.weekStart);
      if(sheet && sheet.days[snap.dayName]){
        const amount = item.data.type==='heures_supp' ? item.data.hours : item.data.minutes;
        applyEntryToDay(sheet.days[snap.dayName], item.data.type, amount, item.data.overtimeDirection);
        let noteText = '';
        if(item.data.type==='retard') noteText = `Retard ${item.data.minutes} min`;
        else if(item.data.type==='depart_anticipe') noteText = `Départ anticipé ${item.data.minutes} min`;
        else if(item.data.type==='absence') noteText = 'Absence';
        else if(item.data.type==='heures_supp') noteText = `Heures supp ${item.data.hours}h`;
        if(item.data.comment) noteText += ` — ${item.data.comment}`;
        const existingComment = sheet.days[snap.dayName].comment;
        sheet.days[snap.dayName].comment = existingComment ? `${existingComment} / ${noteText}` : noteText;
        sheet.updatedBy = session.name;
        sheet.updatedAt = new Date().toISOString();
      }
    }
  } else if(item.type==='employee'){
    if(!db.employees.some(e=>e.id===item.data.id)) db.employees.push(item.data);
  } else if(item.type==='scan'){
    try{
      await window.storage.set(scanKey(item.data.meta.employeeId, item.data.meta.weekStart), item.data.dataUrl, true);
      db.scannedSheets = db.scannedSheets.filter(s=>!(s.employeeId===item.data.meta.employeeId && s.weekStart===item.data.meta.weekStart));
      db.scannedSheets.push(item.data.meta);
    }catch(e){ showToast('Erreur lors de la restauration du fichier.'); return; }
  } else if(item.type==='account'){
    if(!db.users.some(u=>u.id===item.data.id)) db.users.push(item.data);
  }
  item.restored = true;
  item.restoredBy = session.name;
  item.restoredAt = new Date().toISOString();
  addAudit('Restauration', `${item.summary || item.type} restauré(e) pour ${item.employeeName || ''} (supprimé initialement par ${item.deletedBy})`, {secteur: item.secteur, employeeName: item.employeeName});
  await saveDB();
  showToast('Élément restauré avec succès.');
  render();
}

function attachJournalEvents(){
  document.getElementById('journal-filter-secteur').addEventListener('change', e=>{ journalFilters.secteur = e.target.value; render(); });
  document.getElementById('journal-filter-action').addEventListener('change', e=>{ journalFilters.action = e.target.value; render(); });
  document.querySelectorAll('[data-restore-trash]').forEach(btn=>{
    btn.addEventListener('click', ()=>restoreTrashItem(btn.dataset.restoreTrash));
  });
  if((db.notifLastSeenAt||'1970-01-01') < new Date().toISOString()){
    db.notifLastSeenAt = new Date().toISOString();
    saveDB();
  }
}

/* ---------------- MON ACCES (responsable change son propre PIN) ---------------- */
function viewAccountHTML(){
  const label = session.userId ? `${session.name} — ${session.secteur}` : session.secteur;
  return `
  <div class="card" style="max-width:420px;">
    <h2>Mon accès — ${esc(label)}</h2>
    <p class="helptext">${session.userId ? 'Change ton propre code PIN.' : 'Change le code PIN partagé de ton secteur.'} La Direction et le RH peuvent toujours le consulter et le modifier si besoin.</p>
    <div class="field">
      <label>Nouveau code PIN (4 chiffres)</label>
      <input id="account-new-pin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    </div>
    <div class="field">
      <label>Confirmer le nouveau PIN</label>
      <input id="account-confirm-pin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    </div>
    <button class="btn btn-accent" id="save-pin-account-btn">Mettre à jour mon PIN</button>
    <div id="account-error" class="error-msg" style="display:none;"></div>
  </div>
  `;
}

function attachAccountEvents(){
  document.getElementById('save-pin-account-btn').addEventListener('click', async ()=>{
    const newPin = document.getElementById('account-new-pin').value.trim();
    const confirmPin = document.getElementById('account-confirm-pin').value.trim();
    const errEl = document.getElementById('account-error');
    errEl.style.display = 'none';
    if(!/^\d{4}$/.test(newPin)){ errEl.textContent = 'Le PIN doit contenir 4 chiffres.'; errEl.style.display='block'; return; }
    if(newPin !== confirmPin){ errEl.textContent = 'Les deux PIN ne correspondent pas.'; errEl.style.display='block'; return; }
    if(session.userId){
      const user = db.users.find(u=>u.id===session.userId);
      if(user){
        if(db.users.some(u=>u.id!==user.id && u.secteur===user.secteur && u.pin===newPin)){
          errEl.textContent = 'Ce PIN est déjà utilisé par un collègue de ton secteur — choisis-en un autre.';
          errEl.style.display='block';
          return;
        }
        user.pin = newPin;
        addAudit('PIN modifié', `${user.name} (${user.secteur}) a changé son propre code PIN`, {secteur: user.secteur});
      }
    } else {
      db.pins[session.secteur] = newPin;
      addAudit('PIN modifié', `Code PIN partagé du secteur ${session.secteur} modifié par ${session.name}`, {secteur: session.secteur});
    }
    await saveDB();
    showToast('PIN mis à jour.');
    document.getElementById('account-new-pin').value = '';
    document.getElementById('account-confirm-pin').value = '';
  });
}

/* ---------------- SETTINGS (direction/RH only) ---------------- */
let autoBackupsList = null;
function viewSettingsHTML(){
  const secteurOptions = LOGIN_SECTORS.map(s=>`<option value="${s}">${s}</option>`).join('');
  const userRows = LOGIN_SECTORS.map(s=>{
    const users = db.users.filter(u=>u.secteur===s);
    return `
    <div class="card" style="margin-bottom:10px;">
      <h2 style="font-size:14px;">${s} <span class="mono" style="font-size:12px;color:var(--ink-soft);">(${users.length} compte${users.length>1?'s':''})</span></h2>
      ${users.length ? `<table>
        <thead><tr><th>Prénom</th><th>PIN</th><th></th></tr></thead>
        <tbody>${users.map(u=>`<tr>
          <td>${esc(u.name)}</td>
          <td><input class="small mono user-pin-input" data-user="${u.id}" type="text" maxlength="4" inputmode="numeric" value="${u.pin}" style="width:70px;text-align:center;"></td>
          <td style="white-space:nowrap;"><button class="btn btn-ghost btn-sm" data-save-user-pin="${u.id}">Enregistrer</button> <button class="btn btn-danger btn-sm" data-remove-user="${u.id}">Retirer</button></td>
        </tr>`).join('')}</tbody>
      </table>` : `<p class="helptext" style="color:var(--danger);">Aucun compte — personne ne peut se connecter à ce secteur tant qu'un compte n'est pas créé ci-dessus.</p>`}
    </div>`;
  }).join('');

  return `
  <div class="card" style="border:2px solid var(--accent);">
    <h2>🛡️ Sauvegarde de sécurité — à faire avant chaque mise à jour du site</h2>
    <p class="helptext">Ce fichier contient <strong>absolument tout</strong> : employés, comptes/PIN, plannings, congés, historique, scans (liste), journal. Télécharge-le régulièrement, et surtout <strong>juste avant</strong> de republier une nouvelle version de l'app. Si jamais des données disparaissent après une publication, réimporte ce fichier pour tout récupérer instantanément.</p>
    <div class="row-inline">
      <button class="btn btn-accent" id="export-backup-btn">📥 Télécharger la sauvegarde complète</button>
      <label class="btn btn-ghost" style="cursor:pointer;">📤 Restaurer une sauvegarde<input type="file" id="import-backup-input" accept="application/json,.json" style="display:none;"></label>
    </div>
    <p class="helptext" style="margin-top:10px;color:var(--danger);">⚠️ Restaurer une sauvegarde remplace TOUTES les données actuelles par celles du fichier — à utiliser seulement si tu as bien perdu des données.</p>
  </div>

  <div class="card">
    <h2>🕗 Backups automatiques quotidiens</h2>
    <p class="helptext">Une copie complète est sauvegardée automatiquement dans Firebase, la première fois que l'app est ouverte chaque jour — sans rien faire. Voici les derniers jours disponibles :</p>
    <div id="autobackup-list-wrap">
      ${autoBackupsList === null ? '<p class="helptext">Chargement…</p>' : autoBackupsList.length ? `
      <table>
        <thead><tr><th>Date</th><th></th></tr></thead>
        <tbody>${autoBackupsList.map(d=>`<tr><td class="mono">${fmtDate(d)}</td><td><button class="btn btn-ghost btn-sm" data-restore-autobackup="${d}">Restaurer ce jour</button></td></tr>`).join('')}</tbody>
      </table>` : emptyHTML('Aucun backup automatique pour le moment — reviens demain.')}
    </div>
  </div>

  <div class="card">
    <h2>Plafond annuel d'heures supplémentaires</h2>
    <p class="helptext">Utilisé pour les alertes dans l'onglet "Heures Supp" (contingent annuel). ${session.role==='rh' ? 'Modifiable ci-dessous.' : 'Seul le RH peut modifier cette valeur.'}</p>
    <div class="row-inline">
      ${session.role==='rh'
        ? `<input type="number" min="0" id="ot-limit-input" class="small" style="width:90px;" value="${db.overtimeAnnualLimit||180}"><span class="helptext">heures / an</span><button class="btn btn-accent btn-sm" id="ot-limit-save">Enregistrer</button>`
        : `<span class="mono" style="font-size:16px;font-weight:700;">${db.overtimeAnnualLimit||180}h / an</span>`}
    </div>
  </div>

  <div class="card">
    <h2>Comptes de connexion</h2>
    <p class="helptext">Chaque personne se connecte avec le secteur + son propre code PIN. Crée ici un compte (prénom + PIN à 4 chiffres) pour chaque personne — Direction, RH, ou un des 4 rayons.</p>
    <div class="row-inline">
      <input id="new-user-name" class="small" type="text" placeholder="Prénom (ex : Zinaida)" style="flex:1;min-width:160px;">
      <select id="new-user-secteur" class="small">${secteurOptions}</select>
      <input id="new-user-pin" class="small mono" type="text" maxlength="4" inputmode="numeric" placeholder="PIN" style="width:70px;text-align:center;">
      <button class="btn btn-accent btn-sm" id="add-user-btn">Créer le compte</button>
    </div>
  </div>

  ${userRows}
  `;
}

function attachSettingsEvents(){
  if(autoBackupsList === null){
    window.storage.list('autobackup_', true).then(res=>{
      const dates = (res && res.keys ? res.keys : [])
        .map(k=>k.replace('autobackup_',''))
        .filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d))
        .sort().reverse()
        .slice(0,30);
      autoBackupsList = dates;
      render();
    }).catch(()=>{ autoBackupsList = []; render(); });
  }
  document.querySelectorAll('[data-restore-autobackup]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const date = btn.dataset.restoreAutobackup;
      if(!(await customConfirm(`Restaurer le backup automatique du ${fmtDate(date)} ? Toutes les données actuelles seront remplacées.`))) return;
      try{
        const res = await window.storage.get('autobackup_'+date, true);
        if(!res || !res.value){ showToast('Ce backup est introuvable.'); return; }
        const parsed = JSON.parse(res.value);
        db = Object.assign(defaultDB(), parsed);
        await saveDB();
        showToast('Backup du '+fmtDate(date)+' restauré avec succès.');
        session = null;
        render();
      }catch(e){
        showToast('Impossible de restaurer ce backup.');
      }
    });
  });

  const otLimitBtn = document.getElementById('ot-limit-save');
  if(otLimitBtn){
    otLimitBtn.addEventListener('click', async ()=>{
      const val = parseInt(document.getElementById('ot-limit-input').value, 10);
      if(isNaN(val) || val<0){ showToast('Valeur invalide.'); return; }
      const old = db.overtimeAnnualLimit || 180;
      db.overtimeAnnualLimit = val;
      addAudit('Plafond heures supp modifié', `${old}h → ${val}h par an, modifié par ${session.name}`, {});
      await saveDB();
      showToast('Plafond mis à jour.');
      render();
    });
  }


  document.getElementById('export-backup-btn').addEventListener('click', ()=>{
    const dataStr = JSON.stringify(db, null, 2);
    const blob = new Blob([dataStr], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `sauvegarde_rh_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Sauvegarde téléchargée.');
  });

  document.getElementById('import-backup-input').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const text = await file.text();
    let parsed;
    try{
      parsed = JSON.parse(text);
    }catch(err){
      showToast('Ce fichier n\u2019est pas une sauvegarde valide (JSON incorrect).');
      return;
    }
    if(!parsed || !Array.isArray(parsed.employees)){
      showToast('Ce fichier ne ressemble pas à une sauvegarde de cette application.');
      return;
    }
    const empCount = parsed.employees.length;
    const userCount = Array.isArray(parsed.users) ? parsed.users.length : 0;
    if(!(await customConfirm(`Restaurer cette sauvegarde (${empCount} employé(s), ${userCount} compte(s)) ? Toutes les données actuelles seront remplacées.`))) return;
    db = Object.assign(defaultDB(), parsed);
    await saveDB();
    showToast('Sauvegarde restaurée avec succès.');
    session = null;
    render();
  });

  document.getElementById('add-user-btn').addEventListener('click', async ()=>{
    const name = document.getElementById('new-user-name').value.trim();
    const secteur = document.getElementById('new-user-secteur').value;
    const pin = document.getElementById('new-user-pin').value.trim();
    if(!name){ showToast('Entre un prénom.'); return; }
    if(!/^\d{4}$/.test(pin)){ showToast('Le PIN doit contenir 4 chiffres.'); return; }
    if(db.users.some(u=>u.secteur===secteur && u.pin===pin)){ showToast('Ce PIN est déjà utilisé dans ce secteur — choisis-en un autre.'); return; }
    db.users.push({ id: uid(), name, secteur, pin });
    addAudit('Compte créé', `Compte créé pour ${name} (${secteur})`, {secteur, employeeName:name});
    await saveDB();
    showToast(`Compte de ${name} créé.`);
    render();
  });

  document.querySelectorAll('[data-save-user-pin]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const userId = btn.dataset.saveUserPin;
      const input = document.querySelector(`.user-pin-input[data-user="${userId}"]`);
      const val = input.value.trim();
      if(!/^\d{4}$/.test(val)){ showToast('Le PIN doit contenir 4 chiffres.'); return; }
      const user = db.users.find(u=>u.id===userId);
      if(!user) return;
      if(db.users.some(u=>u.id!==userId && u.secteur===user.secteur && u.pin===val)){ showToast('Ce PIN est déjà utilisé par un autre compte de ce secteur.'); return; }
      user.pin = val;
      addAudit('PIN modifié', `Code PIN du compte ${user.name} (${user.secteur}) modifié par ${session.name}`, {secteur:user.secteur});
      await saveDB();
      showToast(`PIN de ${user.name} mis à jour.`);
    });
  });

  document.querySelectorAll('[data-remove-user]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const user = db.users.find(u=>u.id===btn.dataset.removeUser);
      if(!user) return;
      if(!(await customConfirm(`Retirer le compte de ${user.name} ?`))) return;
      db.users = db.users.filter(u=>u.id!==user.id);
      addAudit('Compte retiré', `Compte individuel de ${user.name} (${user.secteur}) retiré`, {secteur:user.secteur});
      await saveDB();
      showToast('Compte retiré.');
      render();
    });
  });
}
